<script>
(()=>{
const W=160,H=120,OX=260,OY=170;
const X=wx=>(wx-OX)/2, Y=wy=>(wy-OY)/2;
const cv=document.getElementById('hd'),g=cv.getContext('2d');
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];const bay=(x,y)=>BAYER[(y&3)*4+(x&3)]/16;
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const P=(c,x,y,col,w=1,h=1)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)};
function noiseGrid(cell){const gw=Math.ceil(W/cell)+2,gh=Math.ceil(H/cell)+2,v=[];for(let i=0;i<gw*gh;i++)v.push(rnd());
  return (x,y)=>{const fx=x/cell,fy=y/cell,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,s=t=>t*t*(3-2*t);const a=v[iy*gw+ix],b=v[iy*gw+ix+1],c=v[(iy+1)*gw+ix],d=v[(iy+1)*gw+ix+1];return (a+(b-a)*s(tx))*(1-s(ty))+(c+(d-c)*s(tx))*s(ty)}}

// ---------- static background ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');
(function(){
  const n1=noiseGrid(14),n2=noiseGrid(5);
  const G=['#34432a','#3b4b2d','#435532','#4b5e37','#556a3d'];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=n1(x,y)*.7+n2(x,y)*.3;let k=Math.floor(v*4.2+bay(x,y)*.9);k=Math.max(0,Math.min(4,k));P(b,x,y,G[k])}
  // grass blades
  for(let i=0;i<520;i++){const x=rnd()*W|0,y=rnd()*H|0,c=rnd();P(b,x,y,c<.5?'#61763f':'#6f8746');P(b,x,y+1,'#3a4a2c');if(c>.85)P(b,x+1,y-1,'#7b9450')}
  // dry patches
  for(let i=0;i<60;i++){const x=rnd()*W|0,y=rnd()*H|0;P(b,x,y,'#7d7a45')}
  // tiny flowers
  for(let i=0;i<14;i++){const x=rnd()*W|0,y=rnd()*H|0;P(b,x,y,rnd()<.5?'#e8e0b0':'#d8c060');P(b,x,y+1,'#2f3d24')}
  // dirt paths (same curves as the game)
  const D=['#5a4d37','#64563d','#6e5f44','#7a6a4d'];const nd=noiseGrid(4);
  const stamp=(cx,cy,r)=>{for(let dy=-r-1;dy<=r+1;dy++)for(let dx=-r-1;dx<=r+1;dx++){const d=Math.hypot(dx,dy);const x=Math.round(cx+dx),y=Math.round(cy+dy);if(x<0||y<0||x>=W||y>=H)continue;
      if(d>r+bay(x,y)*1.4-.4)continue;let k=Math.floor(nd(x,y)*3.6+bay(x,y)*.8);k=Math.max(0,Math.min(3,k));if(d>r-1.2)k=0;b.fillStyle=D[k];b.fillRect(x,y,1,1)}};
  const curve=(x0,y0,cx,cy,x1,y1)=>{for(let t=0;t<=1;t+=.003){const u=1-t;stamp(X(u*u*x0+2*u*t*cx+t*t*x1),Y(u*u*y0+2*u*t*cy+t*t*y1),4.2)}};
  curve(400,330,260,250,170,140);curve(400,330,300,380,190,390);curve(420,320,560,260,660,240);
  // pebbles on the path
  for(let i=0;i<40;i++){const t=rnd(),u=1-t,x=X(u*u*400+2*u*t*560+t*t*660)+rnd()*8-4,y=Y(u*u*320+2*u*t*260+t*t*240)+rnd()*6-3;P(b,x,y,'#8a8478');P(b,x,y+1,'#4a4438')}
  for(let i=0;i<30;i++){const t=rnd(),u=1-t,x=X(u*u*400+2*u*t*260+t*t*170)+rnd()*8-4,y=Y(u*u*330+2*u*t*250+t*t*140)+rnd()*6-3;P(b,x,y,'#8a8478');P(b,x,y+1,'#4a4438')}
})();

// ---------- shading helpers ----------
function blobShade(c,cx,cy,parts,pal,outline){ // parts: [ox,oy,r]
  const minx=Math.floor(cx-30),maxx=Math.ceil(cx+30),miny=Math.floor(cy-30),maxy=Math.ceil(cy+30);
  const inside=(x,y)=>{let best=null;for(const [ox,oy,r] of parts){const dx=x-(cx+ox),dy=y-(cy+oy),d=Math.hypot(dx,dy)/r;if(d<=1&&(!best||d<best.d))best={d,dx,dy,r}}return best};
  for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){
    const h=inside(x,y);if(!h)continue;
    const edge=!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);
    if(edge){P(c,x,y,outline);continue}
    const light=(-h.dx-h.dy)/(h.r*1.4)*.5+.5-(h.d*.25); // lit from top-left
    let k=Math.floor(light*pal.length+bay(x,y)*.9-.2);k=Math.max(0,Math.min(pal.length-1,k));P(c,x,y,pal[k]);
  }
}
const LEAF=['#22401f','#2b4f26','#35602d','#417336','#518a41','#64a050'];
function tree(c,wx,wy,r,s){seed=s;const cx=X(wx),cy=Y(wy);
  c.fillStyle='rgba(10,16,8,.35)';c.beginPath();c.ellipse(cx+3,cy+2,r*1.1,r*.45,0,0,7);c.fill();
  P(c,cx-2,cy-6,'#4a3624',4,8);P(c,cx-2,cy-6,'#5e4630',1,8);P(c,cx+1,cy-6,'#33251a',1,8);P(c,cx-4,cy+1,'#4a3624',2,1);P(c,cx+2,cy+1,'#4a3624',3,1);
  const parts=[[0,-r*1.0,r*.75]];for(let i=0;i<6;i++){const a=i/6*Math.PI*2+rnd();parts.push([Math.cos(a)*r*.5,-r*1.0+Math.sin(a)*r*.38,r*(.42+rnd()*.18)])}
  blobShade(c,cx,cy,parts,LEAF,'#152813');
  for(let i=0;i<10;i++){const a=rnd()*7,d=rnd()*r*.6;P(c,cx+Math.cos(a)*d-r*.15,cy-r*1.15+Math.sin(a)*d*.7,'#7ab45e')}
}

// ---------- scene objects ----------
function shelter(c){
  const x0=Math.round(X(338)),y0=Math.round(Y(184)),w=62,h=40;
  c.fillStyle='rgba(8,10,6,.45)';c.fillRect(x0+3,y0+4,w,h);
  // floor planks
  for(let y=y0+3;y<y0+h-3;y++){const row=Math.floor((y-y0-3)/4);for(let x=x0+3;x<x0+w-3;x++){
    let col=row%2?'#87704f':'#8f7755';if((y-y0-3)%4===3)col='#6a5539';if(((x+row*13)%19)===0)col='#6a5539';
    if(rnd()<.05)col=row%2?'#7d6748':'#957c5a';P(c,x,y,col)}}
  for(let i=0;i<14;i++)P(c,x0+5+rnd()*(w-10),y0+5+rnd()*(h-10),'#5a4630');
  // log walls
  const log=(x,y,len,vert)=>{for(let i=0;i<len;i++){const px=vert?x:x+i,py=vert?y+i:y;const seg=i%11===0;
      P(c,px,py,seg?'#3a2a1b':'#7a5c3e',vert?1:1,1);P(c,vert?px+1:px,vert?py:py+1,seg?'#2f2216':'#5e4630');P(c,vert?px+2:px,vert?py:py+2,seg?'#2a1e14':'#46331f')}};
  log(x0,y0,w,false);log(x0,y0+h-3,23,false);log(x0+w-23,y0+h-3,23,false);log(x0,y0,h,true);log(x0+w-3,y0,h,true);
  [[x0-1,y0-1],[x0+w-4,y0-1],[x0-1,y0+h-4],[x0+w-4,y0+h-4]].forEach(([x,y])=>{P(c,x,y,'#2e2116',5,5);P(c,x+1,y+1,'#5a4330',3,3);P(c,x+1,y+1,'#6e5238',2,1)});
  // threshold
  P(c,x0+23,y0+h-2,'#5e4a34',16,2);P(c,x0+23,y0+h-2,'#77603f',16,1);
  // radio
  const rx=Math.round(X(368))-6,ry=Math.round(Y(222))-5;
  P(c,rx+1,ry+1,'rgba(0,0,0,.35)',13,9);P(c,rx,ry,'#2a2926',13,9);P(c,rx+1,ry+1,'#46443e',11,7);P(c,rx+1,ry+1,'#58564e',11,1);
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)P(c,rx+2+i*2,ry+3+j*2,'#22211e');
  P(c,rx+8,ry+2,'#cdb88c',4,3);P(c,rx+9,ry+3,'#8a3a2a');P(c,rx+8,ry+6,'#9a968a',2,2);P(c,rx+10,ry+6,'#9a968a',2,2);
  for(let i=0;i<7;i++)P(c,rx+11+i,ry-1-i,'#8a8a86');P(c,rx+18,ry-8,'#c8c8c0');
  // crate
  const cx2=x0+5,cy2=y0+h-13;P(c,cx2+1,cy2+1,'rgba(0,0,0,.35)',9,8);P(c,cx2,cy2,'#6e5232',9,8);P(c,cx2,cy2,'#8a6a42',9,1);P(c,cx2,cy2+4,'#4e3a24',9,1);P(c,cx2+4,cy2,'#4e3a24',1,8);
  // bed
  const bx=Math.round(X(420)),by=Math.round(Y(204));
  P(c,bx+1,by+1,'rgba(0,0,0,.35)',17,21);P(c,bx,by,'#3c2c1e',17,21);P(c,bx+1,by+1,'#5f6e7e',15,19);
  for(let y=0;y<19;y++)P(c,bx+1,by+1+y,'#71818f',2,1);
  P(c,bx+2,by+2,'#d8d2c2',13,5);P(c,bx+2,by+2,'#ece6d6',13,1);P(c,bx+2,by+6,'#b8b0a0',13,1);
  P(c,bx+1,by+10,'#8a4b3c',15,10);P(c,bx+1,by+10,'#a35c4a',15,1);for(let x=0;x<15;x+=3)P(c,bx+1+x,by+12,'#6a3428',1,8);
}
function car(c){
  const x0=Math.round(X(490)),y0=Math.round(Y(176));
  c.save();c.translate(x0+20,y0+11);c.rotate(-.18);c.translate(-20,-11);
  c.fillStyle='rgba(8,10,6,.45)';c.fillRect(3,4,40,22);
  P(c,0,1,'#5a2e1a',40,22);P(c,1,2,'#8a4b2c',38,20);P(c,1,2,'#a35f38',38,2);P(c,1,20,'#6a3520',38,2);

function barrel(c){const cx=X(488),cy=Y(296);
