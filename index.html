<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>마지막 사람 — 프로토타입</title>
<style>
  :root{--bg:#0f0e12;--panel:rgba(22,20,26,.86);--solid:#1e1b22;--line:#3b3540;--edge:#0b0a0d;--text:#ece4d2;--dim:#a39b8c;--accent:#e8a84c}
  *{box-sizing:border-box}
  html,body{overscroll-behavior:none;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #wrap{max-width:min(960px,calc((100vh - 215px) * 1.6667));min-width:min(100%,620px);margin:0 auto;padding:10px}
  #game{position:relative;background:#16141a;border:3px solid var(--line);box-shadow:0 0 0 3px var(--edge),6px 6px 0 3px var(--edge)}
  #stage{position:relative;line-height:1.4}
  #cv{display:block;width:100%;height:auto;touch-action:none;background:#2d3b26;image-rendering:pixelated;image-rendering:crisp-edges}
  .pbox{background:var(--panel);border:2px solid #000;box-shadow:inset 0 0 0 2px var(--line)}
  .band{background:#1b1820;border-color:#000;border-style:solid;border-width:0}
  /* top status band */
  #hudTop{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:3px solid #000;box-shadow:inset 0 -2px 0 var(--line)}
  #dayInfo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  #title{font-weight:800;font-size:13px;text-shadow:1px 1px 0 #000}
  #themeTxt{color:var(--accent);font-size:12px}
  #clock{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--text)}
  #stats{display:flex;gap:10px;flex:1;min-width:0}
  .stat{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
  .stat b{color:var(--text);font-family:"Press Start 2P",monospace;font-size:8px;min-width:18px;text-align:right}
  .bar{height:7px;background:#0e0d10;border:1px solid #000;display:flex;min-width:20px}
  .bar i{display:block;height:100%;transition:width .2s;background-image:linear-gradient(90deg,transparent 0 75%,rgba(0,0,0,.25) 75% 100%);background-size:6px 100%}
  #topBtns{display:flex;gap:6px}
  .ib{font:inherit;font-size:12px;padding:3px 8px}
  #stats2{display:none}
  /* bottom dialog band */
  #dialog{border-top:3px solid #000;box-shadow:inset 0 2px 0 var(--line);padding:8px 10px 9px;display:flex;flex-direction:column;gap:6px;min-height:128px}
  #mono{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #say{font-size:13.5px;color:#efe7d4;line-height:1.5}
  #say:before{content:"▶ ";color:var(--accent);font-size:10px}
  #count{font-size:11px;color:var(--accent);white-space:nowrap;padding-top:2px}
  #say:empty,#count:empty{display:none}
  #log{font-size:12px;line-height:1.5;min-height:18px;border-top:1px dashed #3b3540;padding-top:5px}
  #log p{margin:0;color:var(--dim)}
  #log p:first-child{color:#d8cfbb;animation:fadein .4s}
  #log p:first-child:before{content:"· ";color:var(--accent)}
  #log p:nth-child(n+2){display:none}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #hudBottom{display:flex;gap:10px;align-items:flex-end;margin-top:auto}
  #inv{font-size:12px;flex:1 1 auto;display:flex;align-items:center;flex-wrap:wrap;min-height:30px}
  #inv .lbl{color:var(--dim);font-size:11px;margin-right:6px}
  #inv span.item{display:inline-flex;align-items:center;gap:3px;background:#0e0d10;border:1px solid var(--line);padding:1px 5px;margin:1px 3px 1px 0;white-space:nowrap}
  #actions{display:none}
  #ring{position:absolute;left:0;top:0;z-index:6;pointer-events:auto;display:none;min-width:150px;max-width:240px;background:rgba(14,13,17,.93);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line),3px 3px 0 rgba(0,0,0,.5);padding:3px}
  #ring.on{display:block;animation:rbIn .15s steps(3)}
  .cmh{font-size:11px;color:var(--accent);padding:2px 6px 3px;white-space:nowrap}
  .cm{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:transparent;box-shadow:none;border:0;border-top:1px solid #2a2630;padding:5px 6px;font-size:12.5px;line-height:1.3}
  .cm:hover:not(:disabled){background:#3a2f22}
  .cm img{width:20px;height:20px;image-rendering:pixelated;flex:0 0 auto}.cm img.s7{width:21px;height:21px}
  .cm .lb{flex:1}.cm .t{color:var(--dim);font-size:10.5px;white-space:nowrap}
  .cm .why{display:block;color:#d88a6a;font-size:10.5px}
  .cm .n{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--accent);flex:0 0 auto}
  .cm:disabled{opacity:.6}
  #bagPop{position:absolute;z-index:8;display:none;min-width:170px;background:rgba(14,13,17,.95);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line),3px 3px 0 rgba(0,0,0,.5);padding:3px}
  #bagPop.on{display:block;animation:rbIn .15s steps(3)}
  #bagPop .none{font-size:12px;color:var(--dim);padding:5px 6px}
  #inv span.item{cursor:pointer}
  #inv span.item.use{border-color:#8a6a3a;box-shadow:inset 0 0 0 1px #5a4428}
  #inv span.item.use:after{content:"●";color:var(--accent);font-size:7px;margin-left:3px}
  .rb{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;padding:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:rbIn .2s steps(3)}
  .rb img{width:20px;height:20px;image-rendering:pixelated;pointer-events:none}
  .rb img.s7{width:21px;height:21px}
  .rb .n{position:absolute;right:2px;bottom:1px;font-family:"Press Start 2P",monospace;font-size:7px;color:var(--accent);text-shadow:1px 1px 0 #000}
  .rb.no{filter:grayscale(.9);opacity:.6}
  .rb.sel{outline:2px solid var(--accent);outline-offset:1px}
  @keyframes rbIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  #cap{position:absolute;left:0;top:0;z-index:7;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(14,13,17,.92);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:3px 8px;font-size:12px;pointer-events:none;color:var(--text)}
  #cap .pl{color:var(--accent);margin-right:6px}
  #cap .why{color:#d88a6a;margin-left:6px}
  #cap .t{color:var(--dim);margin-left:6px;font-size:11px}
  #cap:empty{display:none}
  #actions .where{font-size:11px;color:var(--accent);margin-right:2px}
  #actions .where:empty{display:none}
  button{font:inherit;font-size:13px;background:#4a3a26;color:var(--text);border:2px solid #000;box-shadow:inset -2px -2px 0 #2e2416,inset 2px 2px 0 #6e5638;padding:5px 10px;cursor:pointer;border-radius:0}
  button:hover:not(:disabled){background:#5a472e}
  button:active:not(:disabled){box-shadow:inset 2px 2px 0 #2e2416,inset -2px -2px 0 #6e5638}
  button:disabled{opacity:.55;cursor:default}
  button.ghost{background:#2a2630;box-shadow:inset -2px -2px 0 #1a171e,inset 2px 2px 0 #3c3644;color:var(--dim)}
  button .k{color:var(--accent);margin-right:5px;font-family:"Press Start 2P",monospace;font-size:8px}
  /* in-game windows */
  #ov{position:absolute;inset:0;background:rgba(8,7,10,.8);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
  #ov.hide{display:none}
  .card{max-width:520px;width:100%;max-height:100%;overflow-y:auto;background:var(--solid);border:3px solid var(--line);box-shadow:0 0 0 3px var(--edge),5px 5px 0 3px var(--edge);padding:18px 20px 16px;line-height:1.65;animation:pop .25s steps(4)}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .card h2{margin:0 0 2px;font-size:19px;text-shadow:2px 2px 0 #000}
  .card .sub{color:var(--accent);font-size:13px;margin-bottom:12px}
  .card p{margin:0 0 9px;font-size:13.5px}
  .card .icon{text-align:center;margin:2px 0 8px}
  .card .paper{background:#e9e1cf;color:#2b261d;border:3px solid #2b261d;box-shadow:4px 4px 0 #000;padding:12px 14px;font-size:13.5px;margin:10px 0 14px;white-space:pre-line}
  .card .paper p{margin:0 0 5px}
  .card .small{color:var(--dim);font-size:12px}
  .card .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .card .shelf{text-align:center;margin:4px 0 8px}
  .charlist{display:grid;grid-template-columns:repeat(2,minmax(0,110px));justify-content:center;gap:10px;margin:0 0 6px}
  .charlist button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;background:#2a2630;box-shadow:inset -2px -2px 0 #1a171e,inset 2px 2px 0 #3c3644}
  .charlist button img{image-rendering:pixelated;width:42px;height:66px}
  .charlist button span{font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
  .charlist button small{color:var(--dim);font-size:10px}
  .charlist button.on{background:#4a3a26;box-shadow:inset -2px -2px 0 #2e2416,inset 2px 2px 0 #6e5638;outline:2px solid var(--accent)}
  .daylist{display:grid;gap:6px;margin:10px 0 6px}
  .daylist button{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%}
  .daylist button .d{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--accent);margin-right:10px}
  .daylist button .sk{color:var(--dim);font-size:12px}
  .card .note{background:#22301f;border:3px solid #0e140c;box-shadow:4px 4px 0 #000;padding:10px 12px;margin:0 0 12px;color:#dfe8cf;font-size:12.5px;line-height:1.6;background-image:repeating-linear-gradient(transparent 0 20px,rgba(255,255,255,.05) 20px 21px)}
  .card .note .nh{color:#b9d98a;font-weight:700;margin-bottom:5px}
  .card .note ul{margin:0;padding-left:18px}
  .card .note .did{margin-top:6px;color:#9fb486;font-size:12px}
  /* narrow screens: same bands, just wrapped */
  @media (max-width:700px){
    #wrap{padding:6px;max-width:none;min-width:0}
    #hudTop{flex-wrap:wrap;gap:6px 10px}
    #themeTxt{display:none}
    #stats{order:3;flex-basis:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px}
    #topBtns{margin-left:auto}
    #hudBottom{flex-direction:column;align-items:stretch}
    .rb{width:40px;height:40px;margin:-20px 0 0 -20px}
    #ov{position:fixed}
  }
  /* phones: the camera follows the hero; layouts per orientation */
  body[data-mode=phoneP] #mono{flex-direction:column;gap:3px}
  body[data-mode=phoneP] #count{white-space:normal;align-self:flex-start}
  body[data-mode=phoneP] #wrap{padding:4px;min-width:0;max-width:min(100%,calc((100vh - 235px) * .8))}
  body[data-mode=phoneL] #wrap{padding:0;min-width:0;max-width:none}
  body[data-mode=phoneL] #game{border-width:0;box-shadow:none}
  body[data-mode=phoneL] #hudTop,body[data-mode=phoneL] #dialog{position:absolute;left:0;right:0;z-index:5;background:rgba(22,20,26,.8)}
  body[data-mode=phoneL] #hudTop{top:0;padding:3px 8px;gap:8px}
  body[data-mode=phoneL] #dialog{bottom:0;min-height:0;padding:4px 10px 5px;gap:3px}
  body[data-mode=phoneL] #themeTxt,body[data-mode=phoneL] #log,body[data-mode=phoneL] #count{display:none}
  body[data-mode=phoneL] .stat{grid-template-columns:auto 1fr;font-size:10px;white-space:nowrap;gap:3px}
  body[data-mode=phoneL] .stat b{display:none}
  body[data-mode=phoneL] #say{font-size:12.5px}
  body[data-mode=phoneL] #inv{flex-wrap:nowrap;overflow-x:auto;min-height:0}
  /* touch screens: finger-sized buttons */
  @media (pointer:coarse){
    .cm{padding:9px 8px;font-size:14px}.cm img{width:24px;height:24px}
    .rb{width:46px;height:46px;margin:-23px 0 0 -23px}
    .rb img{width:26px;height:26px}.rb img.s7{width:28px;height:28px}
    .rb .n{display:none}
    .ib{padding:6px 10px;font-size:13px}
    .card button{padding:9px 14px}
  }
  @media (pointer:coarse) and (min-width:700px){
    #say{font-size:15px}.stat{font-size:12px}#inv{font-size:13px}.card p{font-size:14.5px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <div id="stage">
      <div id="hudTop" class="band">
        <div id="dayInfo"><span id="title">1일차</span><span id="themeTxt">물이 탁해졌다</span><span id="clock">06:00</span></div>
        <div id="stats"></div>
        <div id="topBtns"><button id="zoomBtn" class="ib" title="확대 배율">🔍</button><button id="fsBtn" class="ib" title="전체 화면">⛶</button><button id="pauseBtn" class="ib" title="일시정지">⏸</button><button id="menuBtn" class="ib" title="날짜 선택">☰</button><button id="mute" class="ib" title="배경음악">♪ ON</button></div>
      </div>
      <canvas id="cv" width="800" height="480"></canvas>
      <div id="ring"></div><div id="cap"></div>
      <div id="dialog" class="band">
        <div id="mono"><span id="say"></span><span id="count"></span></div>
        <div id="log"></div>
        <div id="hudBottom">
          <div id="inv"><span class="lbl">배낭</span><div id="invList"></div></div>
          <div id="actions"></div>
        </div>
      </div>
      <div id="stats2"></div>
    </div>
    <div id="bagPop"></div>
    <div id="ov"><div class="card" id="ovCard"></div></div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=480; // world size
// camera: full map on big screens; on phones it zooms in and follows the hero
const ZOOMS=[1.5,2,1]; // PC/tablet: zoomed-in follow camera by default; 1 = whole map
const CAM={x:0,y:0,dx:0,dy:0,z:1,cw:800,ch:480,vw:800,vh:480,mode:'',snap:true,zoom:(()=>{try{const v=+localStorage.getItem('ls_zoom');return ZOOMS.includes(v)?v:1.5}catch(e){return 1.5}})()};
function applyLayout(){
  const small=Math.min(innerWidth,innerHeight)<560,port=innerHeight>innerWidth;
  const mode=small?(port?'phoneP':'phoneL'):'full';
  // landscape phones fill the whole screen, so the canvas takes the screen's own aspect
  const lch=Math.max(300,Math.min(480,Math.round(800*innerHeight/innerWidth/2)*2)),key=mode+(mode==='phoneL'?lch:'')+(mode==='full'?CAM.zoom:'');
  if(key===CAM.key)return;CAM.key=key;CAM.mode=mode;document.body.dataset.mode=mode;
  if(mode==='phoneP'){CAM.cw=480;CAM.ch=600;CAM.z=1.5}else if(mode==='phoneL'){CAM.cw=800;CAM.ch=lch;CAM.z=2}else{CAM.cw=800;CAM.ch=480;CAM.z=CAM.zoom}
  const zb=document.getElementById('zoomBtn');if(zb){zb.style.display=mode==='full'?'':'none';zb.textContent=CAM.zoom===1?'🔍 전체':'🔍 '+CAM.zoom+'×'}
  CAM.vw=CAM.cw/CAM.z;CAM.vh=CAM.ch/CAM.z;cv.width=CAM.cw;cv.height=CAM.ch;CAM.snap=true;
}
function updateCam(){
  const p=S.p,tx=Math.max(0,Math.min(W-CAM.vw,p.x-CAM.vw/2)),ty=Math.max(0,Math.min(H-CAM.vh,p.y-CAM.vh/2));
  if(CAM.snap){CAM.x=tx;CAM.y=ty;CAM.snap=false}else{CAM.x+=(tx-CAM.x)*.12;CAM.y+=(ty-CAM.y)*.12}
  CAM.dx=Math.round(CAM.x/2)*2;CAM.dy=Math.round(CAM.y/2)*2; // whole buffer pixels keep the dots crisp
}
addEventListener('resize',applyLayout);addEventListener('orientationchange',()=>setTimeout(applyLayout,200));

// ---------- things to find ----------
// kind: 'use' = practical item, 'mem' = memory item (can be taken home or left)
const FINDS=[
  {id:'bottle',x:118,y:92,icon:'🧴',kind:'use',name:'찌그러진 페트병',
   text:'콘크리트 틈에 끼어 있던 페트병. 찌그러졌지만 구멍은 없다.\n물을 담을 수 있겠다. 오늘 가장 필요한 물건.'},
  {id:'can',x:300,y:262,icon:'🥫',kind:'use',name:'녹슨 통조림',
   text:'길가 덤불 아래 반쯤 묻혀 있었다. 라벨은 다 지워졌다.\n그래도 먹을 수는 있을 것이다.'},
  {id:'shoe',x:222,y:150,icon:'👟',kind:'mem',name:'작은 운동화',
   text:'아이 발만 한 운동화 한 짝. 끈이 한쪽만 묶여 있다.\n알아본다. 〔형제〕의 운동화다. 그날 정류장에서 급하게 신다 만 그대로.'},
  {id:'letter',x:66,y:165,icon:'✉️',kind:'mem',name:'젖은 편지',
   text:'번진 글씨를 겨우 읽었다.\n\n「수아야, 아빠가 먼저 북쪽 대피소에 가서 자리 잡아 둘게. 엄마 손 꼭 잡고 다음 버스 타. 무서우면 노래 불러. 아빠도 부를게.」'},
  {id:'sign',x:565,y:92,icon:'🚏',kind:'mem',name:'정류장 표지판 조각',
   text:'녹슨 철판에 글자가 남아 있다.\n\n「북쪽 대피소 행 · 막차 18:00」\n\n막차는 왔을까.'},
  {id:'watch',x:92,y:432,icon:'⌚',kind:'mem',name:'멈춘 손목시계',
   text:'나무뿌리에 감겨 있던 손목시계. 바늘이 4시 17분에 멈춰 있다.\n그날, 이 근방 시계는 모두 그 시간에 멈췄다.\n나도 기억한다. 그 시간, 우리는 정류장에서 막차를 기다리고 있었다.'},
  {id:'drawing',x:628,y:405,icon:'🖍️',kind:'mem',name:'크레용 그림',
   text:'강가 바위 틈, 비닐에 싸인 종이 한 장.\n집과 해, 그리고 사람 넷. 엄마, 아빠, 그리고 가장 작은 둘 옆에 삐뚤빼뚤 「수아」, 「〔형제〕」.\n내가 그린 그림이다.'},
  {id:'musicbox',x:262,y:452,icon:'🎵',kind:'mem',name:'오르골',
   text:'흙을 털고 태엽을 감았다.\n몇 음이 흘러나오다 멈췄다.\n엄마가 잠들기 전에 감아 주던 오르골. 다음 음을 안다. 엄마가 흥얼거리던 그대로.'},
];
FINDS.push(
  {id:'umbrella',day:2,x:250,y:96,kind:'mem',name:'노란 우산',
   text:'무너진 벽 틈에 꽂혀 있던 아이용 우산. 노란 천은 바랬고 살이 두 개 부러졌다.\n펼치니 안쪽에 매직으로 쓴 이름.\n\n「3학년 2반 윤수아」'},
  {id:'newspaper',day:2,at:17*60,x:452,y:318,kind:'mem',name:'날아온 신문 조각',
   text:'폭풍에 날려 와 쉼터 앞에 들러붙은 신문 조각. 젖어서 글자가 반쯤 지워졌다.\n\n「…북부 대피소 수용 인원 초과… 도착하지 못한 시민은 각 지역 임시 거처에서 구조를 기다리…」\n\n날짜는 그날의 다음 날이다.'}
);
const visible=f=>(f.map||'home')===(S.map||'home')&&(f.day||1)<=S.day&&(!f.only||f.only.includes(S.day))&&(!f.at||S.t>=f.at)&&(!f.when||f.when());
const memTotal=()=>FINDS.filter(f=>f.kind==='mem'&&(f.day||1)<=S.day).length;

// ---------- state ----------
let S;
function fresh(){return{
  day:1, t:360, hp:80, food:55, water:45, mind:50, warm:90,

function nearPOI(){
  if(S.map&&S.map!=='home')return nearPOIMap();
  const p=S.p;
  // undiscovered things take priority
  for(const f of FINDS){if(!S.found[f.id]&&visible(f)&&Math.hypot(p.x-f.x,p.y-f.y)<34)return{id:'find',find:f,name:'무언가 있다'}}
  if(p.x>628)return POI.find(o=>o.id==='river');
  let best=null,bd=1e9;
  for(const o of POI){if(o.id==='river'||(o.day||1)>S.day||(o.only&&!o.only.includes(S.day)))continue;const d=Math.hypot(p.x-o.x,p.y-o.y);if(d<o.r&&d<bd){bd=d;best=o}}
  return best;
}
const inShelter=()=>(S.map&&S.map!=='home')?!!(MAPS[S.map].inShelter&&MAPS[S.map].inShelter(S.p)):(S.p.x>338&&S.p.x<462&&S.p.y>184&&S.p.y<268);

}

function eatCan(){
  if(!S.inv.can||!S.running)return;
  emote('♥');
  Sfx.play('eat');S.inv.can--;S.ateCan++;S.food=Math.min(100,S.food+30);advance(10);
  log('칼로 통조림을 땄다. 정체 모를 콩 요리. 맛은 상관없다. (식량 +30)');

// ---------- discovery card ----------
function showFind(f){
  S.running=false;
  const EM={letter:'…',newspaper:'…',sign:'?',watch:'…',shoe:'…',drawing:'♥',musicbox:'note',umbrella:'…'};
  if(f.id==='musicbox')Music.musicBox();
  const btns=f.kind==='note'?`<button id="c1">눈에 담는다</button>`:f.kind==='use'
    ? `<button id="c1">챙긴다</button>`
    : `<button id="c1">가져간다</button><button id="c2" class="ghost">그 자리에 둔다</button>`;
  card.innerHTML=`<div class="icon">${iconImg(f.id,70)}</div><h2 style="text-align:center">${f.name}</h2>
  <div class="paper">${f.text}</div><div class="btns" style="justify-content:center">${btns}</div>`;
  ov.classList.remove('hide');
  const close=(em)=>{ov.classList.add('hide');S.running=true;dirtyUI=true;if(em)emote(em,2200)};
  document.getElementById('c1').onclick=()=>{
    Sfx.play('pick');
    if(f.kind==='note'){S.found[f.id]='seen';S.mind=Math.min(100,S.mind+4);log(`${f.name}을(를) 한참 바라봤다. 글자 하나하나를 외웠다.`);close('…');return}
    if(f.id==='bottle'){S.found.bottle='used';S.inv.bottle=true;log('페트병을 챙겼다. 이제 물을 담을 수 있다.')}
    else if(f.id==='can'){S.found.can='used';S.inv.can++;log('통조림을 배낭에 넣었다.')}
    else{S.found[f.id]='taken';S.carry.push(f.id);S.mind=Math.min(100,S.mind+6);log(`${f.name}을(를) 배낭에 넣었다. 쉼터에 가져다 두자. (정신력 +6)`)}
    close(EM[f.id]||'!');
  };
  const c2=document.getElementById('c2');
  if(c2)c2.onclick=()=>{Sfx.play('leave');S.found[f.id]='left';S.mind=Math.min(100,S.mind+2);log(`${f.name}은(는) 그 자리에 두었다. 여기가 그것의 자리 같았다.`);close('…')};
}
function placeCarried(){
  if(S.map&&S.map!=='home')return;
  if(!S.carry.length)return;
  Sfx.play('place');
  for(const id of S.carry){
    S.found[id]='placed';S.placedOrder.push(id);S.mind=Math.min(100,S.mind+4);
    const f=FINDS.find(x=>x.id===id);
    const where=({umbrella:'벽에 기대어 펼쳐',newspaper:'선반 위에 펴서',shoe:'문가에',letter:'선반 위에',sign:'벽에 기대어',watch:'벽에 걸어',drawing:'잠자리 옆에',musicbox:'머리맡에'})[id]||'선반 위에';
    log(`${f.name}을(를) ${where} 두었다. 쉼터가 조금 덜 비어 보인다. (정신력 +4)`);
  }
  S.carry=[];dirtyUI=true;emote('♥');
}

// ---------- weather ----------
function stormLevel(){if(S&&S.day>=10)return S.rainLv||0;if(!S||S.day!==2)return 0;const h=S.t/60;if(h<15)return 0;if(h<16)return h-15;if(h<20)return 1;return Math.max(.6,1-(h-20)*.4)}
function cloudLevel(){if(!S||S.day!==2)return 0;return Math.max(0,Math.min(1,(S.t/60-10)/5))}

// ---------- time & stats ----------
function advance(m){
  S.t+=m;
  if(S.day===2){
    const h=S.t/60,M=S.stormMsgs,say=(k,msg)=>{if(!M[k]){M[k]=1;log(msg);return true}return false};
    if(h>=11)say('a','바람이 거세진다. 나뭇가지가 휘청인다.');
    if(h>=13.5)say('b','서쪽 하늘이 시커멓다. 곧 쏟아질 것 같다.');
    if(h>=15&&say('c','후드득— 비가 쏟아지기 시작했다!')&&(emote('!'),S.fire)){S.fire=false;log('비가 모닥불을 꺼 버렸다.')}
    if(h>=15.5&&say('d','빗물통에 빗물이 차오르는 소리가 들린다.'))S.barrelFull=true;
    if(h>=16)say('e','폭풍이다. 바람이 쉼터를 통째로 흔든다.');
  }
  DAY_HOOKS.tick.forEach(f=>f(m));
  if(S.day>=2){
    const st=stormLevel(),inside=inShelter();let loss=0,gain=0;
    if(st>0&&!inside){loss+=.35*st;if(!S.wet&&st>.2){S.wet=true;S.wasWet=true;emote('drop');log('비에 흠뻑 젖었다. 몸이 빠르게 식는다.')}}
    else if(st>0){loss+=st*((S.prep.roof?0:.12)+(S.prep.door?0:.08)+(S.prep.floor?0:.07));
      if(!S.prep.roof&&st>.5&&!S.wet&&Math.random()<.003*m){S.wet=true;S.wasWet=true;log('지붕 구멍으로 쏟아진 빗물에 옷이 다 젖었다.')}}
    else if(!inside&&S.t>=11*60)loss+=.03;
    if(S.wet)loss+=.12;
    if(inside&&!S.wet&&(st===0||(S.prep.roof&&S.prep.door&&S.prep.floor)))gain+=.06;
    S.warm=Math.max(0,Math.min(100,S.warm+(gain-loss)*m));

  }
  S.water-=0.035*m; S.food-=0.022*m; S.mind-=(S.t>=23*60?0.03:0.012)*m;
  if(S.sick)S.hp-=0.012*m;
  if((S.water<15||S.food<15)&&Math.random()<.004*m&&!(S.emote&&performance.now()<S.emote.until))emote('sweat');
  if(S.water<=0){S.water=0;S.hp-=0.05*m}
  if(S.food<=0){S.food=0;S.hp-=0.03*m}
  if(S.mind<=0){S.mind=0;S.hp-=0.02*m}
  S.hp=Math.min(100,S.hp);
  if(S.hp<=0){S.hp=0;gameOver();return}
  if(S.t>=20*60&&!S.warnedDark){S.warnedDark=true;log('해가 졌다. 쉼터 잠자리에서 잠들면 하루가 끝난다. 서두를 필요는 없다.')}

  if(S.carry.length&&S.t<18*60)s+=' 배낭 속 물건은 쉼터에 가져다 두자.';
  return {s,mem};
}

function revealOn(f,wx,wy,r){
  const cx=wx/FCELL,cy=wy/FCELL,R=r+4;
  for(let y=Math.max(0,cy-R|0);y<=Math.min(FH-1,cy+R|0);y++)for(let x=Math.max(0,cx-R|0);x<=Math.min(FW-1,cx+R|0);x++){

}

let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
function noiseGrid(cell,w,h){const gw=Math.ceil(w/cell)+2,gh=Math.ceil(h/cell)+2,v=[];for(let i=0;i<gw*gh;i++)v.push(rnd());
  return (x,y)=>{const fx=x/cell,fy=y/cell,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,s=t=>t*t*(3-2*t);const a=v[iy*gw+ix],b=v[iy*gw+ix+1],c=v[(iy+1)*gw+ix],d=v[(iy+1)*gw+ix+1];return (a+(b-a)*s(tx))*(1-s(ty))+(c+(d-c)*s(tx))*s(ty)}}
function blobShade(c,cx,cy,parts,pal,outline){
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;for(const [ox,oy,r] of parts){minx=Math.min(minx,cx+ox-r);maxx=Math.max(maxx,cx+ox+r);miny=Math.min(miny,cy+oy-r);maxy=Math.max(maxy,cy+oy+r)}
  const inside=(x,y)=>{let best=null;for(const [ox,oy,r] of parts){const dx=x-(cx+ox),dy=y-(cy+oy),d=Math.hypot(dx,dy)/r;if(d<=1&&(!best||d<best.d))best={d,dx,dy,r}}return best};
  for(let y=Math.floor(miny);y<=Math.ceil(maxy);y++)for(let x=Math.floor(minx);x<=Math.ceil(maxx);x++){
    const h=inside(x,y);if(!h)continue;
    if(!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1)){P(c,x,y,outline);continue}
    const light=(-h.dx-h.dy)/(h.r*1.4)*.5+.5-(h.d*.25);
    let k=Math.floor(light*pal.length+bay(x,y)*.9-.2);k=Math.max(0,Math.min(pal.length-1,k));P(c,x,y,pal[k]);
  }
}

function crossRiver(k){
  const qs=[
    {t:'배에 오를 때와 앉을 때',p:'수아호는 작고 가볍다. 어떻게 탈까?',o:[{t:'일어서서 균형을 잡는다',d:'멀리 보면서 노를 젓기 좋다'},{t:'몸을 낮추고 배 한가운데에 앉는다',d:'무게중심을 낮게, 가운데로'},{t:'짐과 함께 한쪽 가장자리에 앉는다',d:'내리기 쉽게 기슭 쪽으로'}],ok:1},
    {t:'노 젓는 방향',p:'강물은 북에서 남으로 흐른다. 건너편으로 어떻게 저을까?',o:[{t:'건너편을 향해 똑바로 젓는다',d:'가장 짧은 거리'},{t:'뱃머리를 약간 상류 쪽으로 비스듬히 두고 젓는다',d:'물살에 밀리는 만큼 거슬러'},{t:'물살을 타고 하류로 내려가며 젓는다',d:'힘이 덜 든다'}],ok:1},
  ];
  let wrong=0;
  const step=i=>{if(i>=qs.length)return finish();const q=qs[i];
    choiceCard(q.t,`${FORDS[k].name}에서 건너기 · ${i+1}/2`,q.p,q.o,pick=>{if(pick!==q.ok)wrong++;step(i+1)},'paddle')};
  const loseSome=n=>{const pool=['dfish','dand','can','bandage','charcoal','moss','resin'].filter(x=>S.inv[x]>0);const lost=[];for(let j=0;j<n&&pool.length;j++){const x=pool.splice(Math.random()*pool.length|0,1)[0];S.inv[x]=0;lost.push(x)}if(S.inv.bottle&&n>1&&!lost.length){S.inv.bottle=false;S.inv.bw=null;lost.push('bottle')}S.lostItems=lost;return lost};
  const finish=()=>{
    let msg,ok=false;S.t+=40;
    if(k==='A'){msg='물살이 배 옆구리를 때렸다. 뱃머리가 확 돌아가더니— 뒤집혔다! 차가운 물속에서 배를 붙잡고 겨우 건너편 자갈에 기어올랐다.';S.capsized=true}
    else if(k==='C'){msg='굽이에서 소용돌이가 배를 빙글빙글 돌렸다. 한참을 떠밀리다 겨우 빠져나왔다. 물을 뒤집어쓰고, 한참 아래쪽에 닿았다.';S.spun=true;S.t+=40}
    else if(wrong===0){msg='몸을 낮추고, 뱃머리를 상류로 살짝 틀어 저었다. 물살이 배를 밀어도 곧장 건너편으로 미끄러져 간다. 자갈이 배 바닥을 긁는 소리. 건넜다!';ok=true}
    else{msg=wrong>1?'배가 크게 흔들리고 물살에 한참 밀렸다. 뱃전으로 물이 넘쳐 들어와 온몸이 젖었다. 그래도 넓고 잔잔한 곳이라 겨우 건넜다.':'배가 한 번 크게 기우뚱했다. 물이 튀어 옷이 젖었다. 그래도 넓고 잔잔한 곳이라 무사히 건넜다.';S.wobbled=true}
    if(!ok){S.wet=true;S.wasWet=true;S.warm=Math.max(10,S.warm-(S.capsized?30:15));S.hp-=S.capsized?15:S.spun?6:3;S.mind=Math.max(0,S.mind-(S.capsized?10:4))}
    let lost=[];if((S.capsized||S.spun)&&!S.lashed)lost=loseSome(S.capsized?2:1);
    if(lost.length)msg+=`\n\n묶어 두지 않은 짐이 물에 쓸려 갔다: ${lost.map(x=>({dfish:'말린 생선',dand:'민들레',can:'통조림',bandage:'붕대',charcoal:'숯',moss:'이끼',resin:'송진',bottle:'물병'})[x]).join(', ')}`;
    else if((S.capsized||S.spun)&&S.lashed)msg+='\n\n배에 단단히 묶어 둔 짐은 무사하다.';
    if(S.wet&&S.dryBag)msg+='\n담요에 싸 둔 마른 옷이 있다. 갈아입자.';
    const y=FORDS[k].ey,x=RV.cx(y)+RV.hw(y)+16;
    S.crossed=true;S.crossFord=k;S.boatPos={x:x+8,y:y+12};S.p={x:x+4,y,face:1,step:0};S.target=null;CAM.snap=true;
    choiceCard(ok?'건넜다':'겨우 건넜다','동쪽 기슭',msg.replace(/\n/g,'<br>'),[{t:'계속'}],()=>{emote(ok?'♥':'drop');log(ok?'동쪽 기슭에 닿았다.':'동쪽 기슭이다. 몸이 덜덜 떨린다.')},'paddle');
  };
  step(0);
}

let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  if(S.running){
    const p=S.p;let dx=0,dy=0;
    if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;
    if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;
    if(dx||dy)S.target=null;
    else if(S.target){const tx=S.target.x-p.x,ty=S.target.y-p.y,d=Math.hypot(tx,ty);if(d<3)S.target=null;else{dx=tx/d;dy=ty/d}}
    S._walk=!!(dx||dy);
    if(dx||dy){
      const l=Math.hypot(dx,dy),sp=.15*dt,ox=p.x,oy=p.y;
      p.x+=dx/l*sp;p.y+=dy/l*sp;if(dx)p.face=dx>0?1:-1;const ps0=Math.floor(p.step);p.step+=dt/140;if(Math.floor(p.step)!==ps0&&Math.floor(p.step)%2===0)Sfx.play('step',inShelter()?'wood':stormLevel()>.2?'splash':'grass');
      if(S.map&&S.map!=='home')collideMap(MAPS[S.map],p,ox,oy);else{p.x=Math.max(14,Math.min(645,p.x));p.y=Math.max(22,Math.min(H-14,p.y))}
    }
    updateFog();
    if(inShelter())placeCarried();
    advance(dt/1000/0.2); // 1 game-minute ≈ 0.2 s real time
    if(S.running)renderUI();
  }
  draw(now);
  if(S&&S.running)placeRing();else if(ringEl.classList.contains('on')&&!ov.classList.contains('hide')){ringEl.classList.remove('on');ringEl.innerHTML='';closeBag();lastActKey=''}
  requestAnimationFrame(frame);
}

const Music=(()=>{
  let ac,master,tone,timer,nextBar=0,bar=0,on=true,mel=2,duckUntil=0;
  const BAR=8;
  const chords=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[52,55,59,62]]; // Am7 · Fmaj7 · Cmaj7 · Em7
  const scale=[69,72,74,76,79,81,84];
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const VOL=.55;
  function impulse(sec){const len=ac.sampleRate*sec|0,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return b}
  function start(){
    if(ac){if(ac.state==='suspended')ac.resume();return}
    try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const verb=ac.createConvolver();verb.buffer=impulse(5);const wet=ac.createGain();wet.gain.value=.6;verb.connect(wet);wet.connect(master);
    const dry=ac.createGain();dry.gain.value=.45;dry.connect(master);
    tone=ac.createBiquadFilter();tone.type='lowpass';tone.frequency.value=2400;tone.connect(dry);tone.connect(verb);
    wind();rainNode();
    nextBar=ac.currentTime+.3;
    timer=setInterval(schedule,250);schedule();
    if(on)master.gain.linearRampToValueAtTime(VOL,ac.currentTime+5);
  }
  function schedule(){
    if(!ac)return;
    const night=S&&S.t>=18*60;
    tone.frequency.setTargetAtTime(night?1100:2400,ac.currentTime,3);
    if(rainG){const st=S?stormLevel():0,inside=S&&inShelter();rainG.gain.setTargetAtTime(st*(inside?.07:.13),ac.currentTime,1.5);rainLP.frequency.setTargetAtTime(inside?1400:5000,ac.currentTime,.5)}
    while(nextBar<ac.currentTime+1.5){playBar(nextBar,bar,night);nextBar+=BAR;bar++}
  }
  function playBar(t,n,night){
    const ch=chords[n%4];
    ch.forEach((m,i)=>padNote(mtof(i===0?m-24:m-12),t,BAR+3,i===0?.045:.028));
    for(let k=0;k<8;k++){
      if(t+k<duckUntil)continue; // stay quiet while the music box plays
      const p=night?.2:.3;
      if(Math.random()<p||(k===0&&n%2===0)){
        mel=Math.max(0,Math.min(scale.length-1,mel+Math.round((Math.random()-.5)*3)));
        pluck(mtof(scale[mel]-(night?12:0)),t+k+Math.random()*.1,.12,3.8);
      }
    }
    if(n%4===0&&t>=duckUntil)pluck(mtof(ch[0]-12),t,.08,7);
  }
  function padNote(f,t,dur,vol){
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+3);g.gain.setValueAtTime(vol,t+dur-3);g.gain.linearRampToValueAtTime(0,t+dur);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;
    [-6,6].forEach(d=>{const o=ac.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=d;o.connect(lp);o.start(t);o.stop(t+dur+.1)});
    lp.connect(g);g.connect(tone);
  }
  function pluck(f,t,vol,dec){
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
    const o=ac.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);
    const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2.003;const g2=ac.createGain();g2.gain.value=.18;o2.connect(g2);g2.connect(g);
    g.connect(tone);o.start(t);o2.start(t);o.stop(t+dec+.1);o2.stop(t+dec+.1);
  }
  function wind(){
    const len=ac.sampleRate*3,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){last=(last+(Math.random()*2-1)*.02)*.995;d[i]=last*6}
    const src=ac.createBufferSource();src.buffer=b;src.loop=true;
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.6;
    const lfo=ac.createOscillator();lfo.frequency.value=.06;const lg=ac.createGain();lg.gain.value=220;lfo.connect(lg);lg.connect(bp.frequency);
    const g=ac.createGain();g.gain.value=.05;
    src.connect(bp);bp.connect(g);g.connect(master);src.start();lfo.start();
  }
  let rainG,rainLP;
  function rainNode(){
    const len=ac.sampleRate*2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;

  function sfxInit(){if(sfxOut||!ac)return;sfxOut=ac.createGain();sfxOut.gain.value=.9;sfxOut.connect(ac.destination);
    const len=ac.sampleRate;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}

  function noise(t,dur,type,freq,q,peak,a=.005){const src=ac.createBufferSource();src.buffer=noiseBuf;src.loop=true;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ac.createGain();env(g,t,a,peak,dur);src.connect(f);f.connect(g);g.connect(sfxOut);src.start(t,Math.random()*.5);src.stop(t+a+dur+.05);return f}
  function tone2(t,f,dur,peak,type='sine',glide=0,a=.004){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);const g=ac.createGain();env(g,t,a,peak,dur);o.connect(g);g.connect(sfxOut);o.start(t);o.stop(t+a+dur+.05)}

NOTES[3]={title:'불 피우기',body:['불이 타려면 세 가지가 필요하다: 탈 것, 공기, 열.','작은 것부터 키운다: 불쏘시개(마른 풀·자작나무 껍질) → 잔가지 → 장작.','잔가지는 원뿔 모양으로 세워 공기가 통하게 한다.','젖은 나무는 겉을 깎아 마른 속을 쓴다. 젖은 장작은 연기만 낸다.','부싯돌을 쇳조각에 비스듬히 그어 불꽃을 불쏘시개에 떨어뜨린다.'],

NOTES[5]={title:'응급처치',body:['먼저 지혈: 깨끗한 천으로 상처를 직접 꾹 누르고, 가능하면 심장보다 높이 든다.','피가 멎으면 끓여 식힌 물로 흙과 이물질을 씻어 낸다. 강물로 씻으면 덧날 수 있다.','깨끗한 붕대나 끓여 소독한 천으로 감싸 덮는다.','붓기, 열감, 고름, 번지는 붉은 줄은 감염 신호다. 다시 씻고 갈아 준다.','이름 모를 약, 유통기한 지난 약은 먹지 않는다.'],

NOTES[7]={title:'구조 신호',body:['셋은 국제 조난 신호다: 불 세 개(삼각형), 호루라기 세 번, 연기 세 줄.','낮에는 연기와 거울 반사, 밤에는 불빛이 멀리서 잘 보인다.','흰 연기는 생나무나 젖은 잎을 올려 낸다. 넓고 트인 곳에서.','거울은 한 손을 V자로 내밀어 목표를 겨누고 그 사이로 빛을 보낸다.','땅에 아주 크게 SOS를 만들면 하늘에서 보인다. 주변과 색이 다른 재료로.'],

function showEnding(){
  const skills=['식수 만들기','쉼터와 체온','불 피우기','먹을 것 구하기','응급처치','방향 찾기','구조 신호'];
  const mem=FINDS.filter(f=>f.kind==='mem'&&S.found[f.id]).length,total=FINDS.filter(f=>f.kind==='mem').length;
  Music.musicBox();
  card.innerHTML=`<h2>마지막 사람 · 1부 끝</h2><div class="sub">멸망 후 1년, 일곱 날</div>
  <div class="paper">${S.answered?
  `강 하구 선착장으로 가는 길은 아직 모른다. 내일은 무너진 산 아래를 지나야 할지도 모르고, 떠밀려 온 배를 고쳐야 할지도 모른다.

하지만 이제 나는 안다. 물을 만들 줄 알고, 불을 피울 줄 알고, 북쪽이 어디인지 안다.

그리고 아빠가 살아서 나를 부르고 있다는 것을.

엄마와 〔형제〕도, 분명 어딘가에.`:
  `일곱 날을 혼자 버텼다. 물을 만들고, 불을 피우고, 북쪽을 찾았다.

라디오는 아직 대답하지 않았다. 하지만 신호는 내일도 보낼 수 있다.`}</div>
  <div class="note"><div class="nh">📖 생존 수첩 — 일주일 동안 익힌 것</div><ul>${skills.map((k,i)=>`<li>${i+1}일차 · ${k} ${S.notes.includes(i+1)?'✓':''}</li>`).join('')}</ul><div class="did">찾은 기억 ${mem}/${total} · 탐험 ${explorePct()}%</div></div>
  <p class="small">2부 — 강 하구로. 끈을 꼬고, 짐을 꾸리고, 무너진 산과 강을 지나 선착장까지.</p>
  <div class="btns">${WEEK.find(w=>w.d===8&&w.ready)?'<button id="w2">2주차 시작하기</button>':''}${S.answered?'':'<button id="again" class="ghost">7일차 다시 하기</button>'}<button id="restart" class="ghost">처음부터</button><button id="pick" class="ghost">날짜 선택</button></div>`;
  ov.classList.remove('hide');
  const $=id=>document.getElementById(id);
  if($('again'))$('again').onclick=retryDay;$('restart').onclick=()=>startDay(1);$('pick').onclick=()=>showTitle(false);
  if($('w2'))$('w2').onclick=()=>startDay(8);
}

  <p>강 하구 선착장. 그곳까지 가야 한다. 짐을 묶고, 배를 엮고, 물을 건너려면 무엇보다 <b>끈</b>이 필요하다.</p>
  <p>오늘은 <b>풀과 나무껍질로 끈을 만들고, 일에 맞는 매듭을 고르는 법</b>을 익힌다.</p>
  <p class="small">폐허를 덮은 칡덩굴과 강가 버드나무에서 섬유를 얻을 수 있어요.<br>매듭마다 쓰임이 다릅니다. 일에 맞는 매듭을 골라 보세요.<br>그리고 저녁 일곱 시, 라디오를 잊지 마세요.</p>`};
NOTES[8]={title:'끈과 매듭',body:['칡 같은 덩굴, 버드나무 속껍질처럼 질긴 식물 섬유로 끈을 만든다.','두 가닥을 각각 한쪽으로 비틀고, 서로는 반대 방향으로 감으면 풀리지 않는 끈이 된다.','보우라인: 당겨도 조여들지 않는 고리. 짐을 매달거나 몸에 두를 때.','클로브 히치: 기둥이나 나무에 빠르게 감아 묶을 때.','사각 매듭: 같은 굵기의 두 줄을 이을 때. 무거운 짐을 매다는 데는 쓰지 않는다.','식량은 나무에 높이 매달아 동물에게서 지킨다.'],
  did:()=>{const K=S.knots||{};return [S.cordMade?`끈 꼬기 ${S.cordMade}줄`:null,K.hang?'보우라인':null,K.line?'클로브 히치':null,K.join?'사각 매듭':null].filter(Boolean).join(' · ')||'아직 못 해 봄'}};

  const K=S.knots||{},L=['8일차.'];

  const k=[K.hang&&'식량 자루를 나무에 매달았고',K.line&&'빨랫줄을 맸고',K.join&&'끈을 이어 강 한가운데 물을 길었다'].filter(Boolean);

  if(S.found.knotcard)L.push('상자 밑 매듭 카드. 「수아 연습용」. 토끼가 굴에서 나와 나무를 돌아 다시 굴로. 아빠 목소리로 들렸다.');
  L.push(S.d8radio?'저녁 일곱 시, 라디오. 선착장까지 강을 따라 사흘 거리.':'라디오 시간을 놓쳤다. 내일은 꼭.');
  return L;
};
DAYS[9]={theme:'짐을 꾸리다',wake:'눈을 떴다. 쉼터 천장의 틈을 오래 올려다봤다.',
  intro:()=>`<h2>9일차</h2><div class="sub">짐을 꾸리다</div>
  <p>내일이면 떠난다. 선착장까지 강을 따라 사흘. 쉼터를 떠나 그렇게 멀리 가 본 적이 없다.</p>
  <p>오늘은 <b>먼 길을 떠나기 전에 무엇을 준비하고, 무엇을 먼저 챙기는지</b> 익힌다. 배낭에는 다 들어가지 않는다.</p>
  <p class="small">물, 먹을 것, 젖지 않는 불씨, 그리고 떠난다는 표시.<br>마지막엔 잠자리 옆에서 배낭을 꾸려요. 무게 10까지 넣을 수 있어요.<br>쉼터에 둔 기억 물건 중 무엇을 가져갈지도 직접 고릅니다.</p>`};
NOTES[9]={title:'장거리 이동 준비',body:['짐의 우선순위: 체온(옷·담요) → 물 → 불 → 먹을 것 → 응급처치 → 신호·도구. 남는 자리에 소중한 것.','배낭은 몸무게의 5분의 1에서 4분의 1을 넘지 않게. 무거운 것은 등 가까이, 자주 쓰는 것은 꺼내기 쉬운 곳에.','사람은 하루에 물 2리터 이상이 필요하다. 다 들 수 없다면 물을 구할 수 있는 길(강을 따라)을 고른다.','불 피우는 도구와 불쏘시개는 젖지 않게 싸서 다닌다.','떠나기 전 행선지와 날짜를 적은 쪽지를 남긴다. 누군가 찾으러 오면 그게 길이 된다.'],
  did:()=>{const C=S.pack||[];return [S.kitWrapped?'불씨 방수 포장':null,S.noteLeft?'쪽지 남기기':null,S.packed?`배낭 꾸리기 (${C.length}가지)`:null].filter(Boolean).join(' · ')||'아직 못 해 봄'}};
JOURNAL[9]=(forced,home)=>{
  const P2=S.pack||[],L=['9일차.'];
  if(S.packed){
    const nm={water:'물병',fire:'불 피우기 도구',blanket:'담요',food:'식량',aid:'헝겊과 붕대',cord:'끈',rod:'낚싯대',mirror:'사이드미러',radio:'라디오'};
    const gear=P2.filter(x=>!x.startsWith('mem_')).map(x=>nm[x]).filter(Boolean),mem=P2.filter(x=>x.startsWith('mem_')).map(x=>FINDS.find(f=>f.id===x.slice(4))).filter(Boolean);
    L.push(`배낭에 ${eul(gear.join(', '))} 넣었다.`);
    L.push(mem.length?`그리고 ${mem.map(f=>f.name).join(', ')}. 무게보다 이게 더 필요할 것 같았다.`:'기억 물건은 모두 쉼터에 두고 가기로 했다. 돌아올 이유로 남겨 둔다.');
    if(!P2.includes('radio'))L.push('라디오는 너무 무거워서 두고 간다. 내일부터는 대피소 목소리를 못 듣는다.');
  }else L.push('배낭을 꾸리지 못했다. 무엇을 두고 가야 할지 정하지 못했다.');
  if(S.noteLeft)L.push('문에 쪽지를 남겼다. 「강을 따라 하구 선착장으로 감. 수아.」 내 이름을 처음으로 적어 봤다.');
  if(S.d9radio)L.push('대피소에서 무너진 산에 동굴이 열렸다고 했다. 지름길일지도, 함정일지도.');
  L.push('쉼터에서의 마지막 밤.');
  return L;
};
DAYS[10]={theme:'산이 무너졌다',wake:'쉼터를 떠났다. 무너진 산 앞에 섰다. 바위 틈으로 찬 바람이 분다.',
  intro:()=>`<h2>10일차</h2><div class="sub">산이 무너졌다 · 새 지도: 동굴</div>
  <p>새벽에 쉼터 문을 닫고 나왔다. 산길은 바위로 막혀 있고, 그 옆으로 시커먼 굴이 입을 벌리고 있다. 대피소가 말한 그 동굴이다.</p>
  <p>오늘은 <b>어두운 동굴을 안전하게 지나는 법</b>을 익힌다. 빛, 표시, 공기, 그리고 머리 위.</p>
  <p class="small">이제 배낭에 꾸린 것만 가지고 있어요.<br>동굴 안은 아주 어둡습니다. 빛이 없으면 바로 앞도 보이지 않아요.<br>출구에 도착하면 그곳 야영지에서 하루를 마칩니다.</p>`};
NOTES[10]={title:'동굴 안전',body:['빛은 두 개 이상 가지고 들어간다. 하나가 꺼지면 바로 쓸 예비가 있어야 한다.','갈림길마다 돌아올 쪽을 가리키는 표시를 남긴다.','불꽃이 작아지거나 숨이 가빠지면 공기가 나쁘다는 뜻. 지체 없이 왔던 길로 돌아간다.','천장의 금, 바닥에 새로 떨어진 돌가루는 낙석 신호. 그 아래에 머물지 않는다.','비가 많이 온 날, 물이 차오르는 동굴에는 들어가지 않는다.'],
  did:()=>[S.torchLit||S.torch?'횃불 만들기':null,(S.inv.torch||0)>0?'예비 횃불':null,S.marked?'갈림길 표시':null,S.airChecked?'나쁜 공기 알아채기':null,S.ceiling?'천장 살피기':null].filter(Boolean).join(' · ')||'아직 못 해 봄'};
JOURNAL[10]=(forced,home)=>{
  const L=['10일차.'];
  L.push(S.p.x>700?'동굴을 지났다. 출구로 나왔을 때 하늘이 이렇게 넓었나 싶었다.':'동굴을 다 지나지 못했다. 어둠 속에서 밤을 보낸다.');
  if(S.lost)L.push('갈림길에서 길을 잃고 한참을 헤맸다. 표시 하나면 됐을 텐데.');else if(S.marked)L.push('갈림길에 돌로 화살표를 놓았다. 작은 표시가 길이 된다.');
  if(S.airChecked||S.flags&&S.flags.d10air)L.push('위쪽 굴 끝에서 숨이 막혔다. 횃불이 파랗게 떨렸다. 바로 돌아섰다.');
  if(S.rockHit)L.push('천장에서 떨어진 돌에 어깨를 맞았다. 머리 위를 먼저 봐야 했다.');else if(S.ceiling)L.push('금 간 천장 아래를 벽에 붙어 지났다.');
  if(S.found.carving)L.push('바위벽에 아빠가 새긴 글씨. 「수아 — 아빠 여기 지나감. 아래쪽 길로.」 일 년 전 아빠가 지난 같은 굴, 같은 갈림길.');
  return L;
};
DAYS[11]={theme:'하늘을 읽다',wake:'동굴 출구에서 눈을 떴다. 아래로 강 골짜기가 보인다. 하늘은 맑다… 지금은.',
  intro:()=>`<h2>11일차</h2><div class="sub">하늘을 읽다 · 새 지도: 강 골짜기</div>
  <p>동굴을 빠져나와 강 골짜기로 내려왔다. 하늘은 파랗고 바람은 잔잔하다. 그런데 높은 하늘의 구름 모양이 마음에 걸린다.</p>
  <p>오늘은 <b>하늘과 주변을 보고 날씨를 미리 읽는 법</b>을 익힌다. 비가 온다면, 오기 전에 준비해야 한다.</p>
  <p class="small">언덕 위 바위에서 하늘을, 풀밭에서 새를, 모닥불에서 연기를 살펴보세요.<br>시간에 따라 하늘이 달라집니다.</p>`};
NOTES[11]={title:'날씨 읽기',body:['높은 하늘의 새털구름(권운)은 하루 이틀 안에 날씨가 바뀔 수 있다는 첫 신호.','해나 달 둘레의 무리(햇무리·달무리)는 비구름이 다가온다는 뜻.','제비가 낮게 날고, 연기가 땅에 깔리면 기압이 낮아지는 중이다.','바람이 갑자기 바뀌고 서쪽에 낮고 검은 구름이 쌓이면 한두 시간 안에 비.','"아침노을은 비, 저녁노을은 맑음." 비가 오기 전에 비 피할 곳과 마른 장작부터.'],
  did:()=>{const k=Object.keys(S.sky||{}).map(k=>SKY_SIGNS[k]);if(S.lean>=2)k.push('비 피할 자리');if(S.dryWood||S.flags&&S.flags.d11r&&S.fire)k.push('장작 지키기');return k.join(' · ')||'아직 못 해 봄'}};
JOURNAL[11]=()=>{
  const L=['11일차.'],sk=S.sky||{},n=Object.keys(sk).filter(k=>k!=='red').length;
  L.push(n>=2?`아침엔 맑았다. 그런데 ${Object.keys(sk).filter(k=>k!=='red').map(k=>SKY_SIGNS[k]).join(', ')}… 하늘이 미리 말해 주고 있었다.`:'아침엔 그저 맑은 날인 줄 알았다.');
  L.push(S.lean>=2?'바위에 장대를 기대고 솔가지를 덮었다. 오후 내내 퍼붓는 비를 그 아래에서 마른 채로 지켜봤다.':'비가 쏟아졌을 때 피할 곳이 없었다. 바위 그늘에 웅크려 떨었다.');

};
DAYS[12]={theme:'배를 엮다',wake:'비 갠 아침. 강물이 불었다. 건너편까지 헤엄칠 수는 없다.',

NOTES[12]={title:'나룻배 고치기',body:['나무배의 틈은 이끼나 섬유를 꼭꼭 채운 뒤 역청으로 덮어 막는다.','송진을 녹이고 숯가루를 섞으면 역청이 된다. 뜨거울 때 바르고 식으면 단단히 굳는다.','고친 배는 반드시 얕은 물에서 먼저 띄워 새는 곳이 없는지 확인한다.','노는 넓적한 판자를 곧은 자루에 단단히 묶어 만든다.','혼자 들기 힘든 무게는 굴림대나 지렛대를 쓴다. 허리가 아니라 다리로 민다.'],
  did:()=>[S.boatSeen?'배 살피기':null,(S.holes||[]).some(h=>h)?'역청으로 구멍 막기':null,S.boatReady?'띄워서 확인':null,S.paddle?'노 만들기':null].filter(Boolean).join(' · ')||'아직 못 해 봄'};

DAYS[13]={theme:'물을 건너다',wake:'강물이 조금 줄었다. 수아호가 물가에서 기다린다.',
  intro:()=>`<h2>13일차</h2><div class="sub">물을 건너다</div>

NOTES[13]={title:'물 건너기',body:['좁은 곳은 물살이 빠르고, 넓은 곳은 느리다. 넓고 잔잔하며 바닥이 보이는 곳을 고른다.','검고 소용돌이치는 굽이는 깊다. 피한다.','작은 배에서는 절대 일어서지 않는다. 몸을 낮추고 가운데에 앉는다.','물살을 거스르려면 뱃머리를 상류 쪽으로 비스듬히 두고 젓는다.','짐은 배에 묶고, 마른 옷은 따로 싸 둔다. 젖으면 바로 갈아입거나 불에 말린다.'],
  did:()=>[Object.keys(S.fordSeen||{}).length?'물살 살피기':null,S.lashed?'짐 묶기':null,S.dryBag?'마른 옷 챙기기':null,S.crossed&&S.crossFord==='B'?'안전한 곳에서 건너기':S.crossed?'건너기':null,S.boatSecured?'배 끌어올리기':null].filter(Boolean).join(' · ')||'아직 못 해 봄'};

  L.push(S.crossFord==='B'?(S.wobbled?'넓은 여울에서 건넜다. 한 번 크게 흔들렸지만 무사했다.':'넓고 잔잔한 여울에서 건넜다. 몸을 낮추고, 뱃머리를 상류로. 수아호는 곧장 건너편에 닿았다.'):S.crossFord==='A'?'좁은 여울에서 건너려다 배가 뒤집혔다. 물살이 그렇게 셀 줄은 몰랐다.':'굽이에서 소용돌이에 휘말렸다. 한참을 떠밀려서야 겨우 빠져나왔다.');
  if(S.lostItems&&S.lostItems.length)L.push('묶어 두지 않은 짐 몇 개를 강에 잃었다.');
  if(S.wasWet&&S.dryBag===false&&S.flags)L.push('젖은 몸으로 덜덜 떨었지만, 결국 마른 옷을 입고 불가에 앉았다.');
  L.push('동쪽 기슭. 저 아래 선착장이 보인다. 내일이다.');
  return L;
};

function presetFor(n){
  S=fresh();S.fog=newFog();
  if(n>=2){
    S.inv.bottle=true;S.found.bottle='used';S.lastDrink='boiled';S.drankClean=1;S.notes=[1];
    S.car=1;S.inv.cloth=true;S.signal=true;S.radio=1;
    [[300,200],[200,130],[130,90],[250,330],[160,400],[110,440],[520,280],[620,240],[640,330]].forEach(([x,y])=>revealOn(S.fog,x,y,12));
    S.seenAreas={ruins:1,forest:1,river:1};
    S.food=50;S.water=55;S.mind=55;S.hp=80;
  }
  for(let d=3;d<=n;d++)(PRESET[d]||(()=>{}))();
}
