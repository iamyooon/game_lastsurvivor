<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>마지막 사람 — 프로토타입</title>
<style>
  :root{--bg:#0f0e12;--panel:rgba(22,20,26,.86);--solid:#1e1b22;--line:#3b3540;--edge:#0b0a0d;--text:#ece4d2;--dim:#a39b8c;--accent:#e8a84c}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #wrap{max-width:min(960px,calc((100vh - 215px) * 1.6667));min-width:min(100%,620px);margin:0 auto;padding:10px}
  #game{position:relative;background:#16141a;border:3px solid var(--line);box-shadow:0 0 0 3px var(--edge),6px 6px 0 3px var(--edge)}
  #stage{position:relative;line-height:1.4}
  #cv{display:block;width:100%;height:auto;touch-action:none;background:#2d3b26;image-rendering:pixelated;image-rendering:crisp-edges}
  .pbox{background:var(--panel);border:2px solid #000;box-shadow:inset 0 0 0 2px var(--line)}
  .band{background:#1b1820;border-color:#000;border-style:solid;border-width:0}
  /* top status band */
  #hudTop{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:3px solid #000;box-shadow:inset 0 -2px 0 var(--line)}
  #dayInfo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  #title{font-weight:800;font-size:13px;text-shadow:1px 1px 0 #000}
  #themeTxt{color:var(--accent);font-size:12px}
  #clock{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--text)}
  #stats{display:flex;gap:10px;flex:1;min-width:0}
  .stat{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
  .stat b{color:var(--text);font-family:"Press Start 2P",monospace;font-size:8px;min-width:18px;text-align:right}
  .bar{height:7px;background:#0e0d10;border:1px solid #000;display:flex;min-width:20px}
  .bar i{display:block;height:100%;transition:width .2s;background-image:linear-gradient(90deg,transparent 0 75%,rgba(0,0,0,.25) 75% 100%);background-size:6px 100%}
  #topBtns{display:flex;gap:6px}
  .ib{font:inherit;font-size:12px;padding:3px 8px}
  #stats2{display:none}
  /* bottom dialog band */
  #dialog{border-top:3px solid #000;box-shadow:inset 0 2px 0 var(--line);padding:8px 10px 9px;display:flex;flex-direction:column;gap:6px;min-height:128px}
  #mono{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #say{font-size:13.5px;color:#efe7d4;line-height:1.5}
  #say:before{content:"▶ ";color:var(--accent);font-size:10px}
  #count{font-size:11px;color:var(--accent);white-space:nowrap;padding-top:2px}
  #say:empty,#count:empty{display:none}
  #log{font-size:12px;line-height:1.5;min-height:18px;border-top:1px dashed #3b3540;padding-top:5px}
  #log p{margin:0;color:var(--dim)}
  #log p:first-child{color:#d8cfbb;animation:fadein .4s}
  #log p:first-child:before{content:"· ";color:var(--accent)}
  #log p:nth-child(n+2){display:none}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #hudBottom{display:flex;gap:10px;align-items:flex-end;margin-top:auto}
  #inv{font-size:12px;flex:1 1 auto;display:flex;align-items:center;flex-wrap:wrap;min-height:30px}
  #inv .lbl{color:var(--dim);font-size:11px;margin-right:6px}
  #inv span.item{display:inline-flex;align-items:center;gap:3px;background:#0e0d10;border:1px solid var(--line);padding:1px 5px;margin:1px 3px 1px 0;white-space:nowrap}
  #actions{display:none}
  #ring{position:absolute;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none}
  .rb{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;padding:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:rbIn .2s steps(3)}
  .rb img{width:20px;height:20px;image-rendering:pixelated;pointer-events:none}
  .rb img.s7{width:21px;height:21px}
  .rb .n{position:absolute;right:2px;bottom:1px;font-family:"Press Start 2P",monospace;font-size:7px;color:var(--accent);text-shadow:1px 1px 0 #000}
  .rb.no{filter:grayscale(.9);opacity:.6}
  .rb.sel{outline:2px solid var(--accent);outline-offset:1px}
  @keyframes rbIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  #cap{position:absolute;left:0;top:0;z-index:7;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(14,13,17,.92);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:3px 8px;font-size:12px;pointer-events:none;color:var(--text)}
  #cap .pl{color:var(--accent);margin-right:6px}
  #cap .why{color:#d88a6a;margin-left:6px}
  #cap .t{color:var(--dim);margin-left:6px;font-size:11px}
  #cap:empty{display:none}
  #actions .where{font-size:11px;color:var(--accent);margin-right:2px}
  #actions .where:empty{display:none}
  button{font:inherit;font-size:13px;background:#4a3a26;color:var(--text);border:2px solid #000;box-shadow:inset -2px -2px 0 #2e2416,inset 2px 2px 0 #6e5638;padding:5px 10px;cursor:pointer;border-radius:0}
  button:hover:not(:disabled){background:#5a472e}
  button:active:not(:disabled){box-shadow:inset 2px 2px 0 #2e2416,inset -2px -2px 0 #6e5638}
  button:disabled{opacity:.55;cursor:default}
  button.ghost{background:#2a2630;box-shadow:inset -2px -2px 0 #1a171e,inset 2px 2px 0 #3c3644;color:var(--dim)}
  button .k{color:var(--accent);margin-right:5px;font-family:"Press Start 2P",monospace;font-size:8px}
  /* in-game windows */
  #ov{position:absolute;inset:0;background:rgba(8,7,10,.8);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
  #ov.hide{display:none}
  .card{max-width:520px;width:100%;max-height:100%;overflow-y:auto;background:var(--solid);border:3px solid var(--line);box-shadow:0 0 0 3px var(--edge),5px 5px 0 3px var(--edge);padding:18px 20px 16px;line-height:1.65;animation:pop .25s steps(4)}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .card h2{margin:0 0 2px;font-size:19px;text-shadow:2px 2px 0 #000}
  .card .sub{color:var(--accent);font-size:13px;margin-bottom:12px}
  .card p{margin:0 0 9px;font-size:13.5px}
  .card .icon{text-align:center;margin:2px 0 8px}
  .card .paper{background:#e9e1cf;color:#2b261d;border:3px solid #2b261d;box-shadow:4px 4px 0 #000;padding:12px 14px;font-size:13.5px;margin:10px 0 14px;white-space:pre-line}
  .card .paper p{margin:0 0 5px}
  .card .small{color:var(--dim);font-size:12px}
  .card .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .card .shelf{text-align:center;margin:4px 0 8px}
  .daylist{display:grid;gap:6px;margin:10px 0 6px}
  .daylist button{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%}
  .daylist button .d{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--accent);margin-right:10px}
  .daylist button .sk{color:var(--dim);font-size:12px}
  .card .note{background:#22301f;border:3px solid #0e140c;box-shadow:4px 4px 0 #000;padding:10px 12px;margin:0 0 12px;color:#dfe8cf;font-size:12.5px;line-height:1.6;background-image:repeating-linear-gradient(transparent 0 20px,rgba(255,255,255,.05) 20px 21px)}
  .card .note .nh{color:#b9d98a;font-weight:700;margin-bottom:5px}
  .card .note ul{margin:0;padding-left:18px}
  .card .note .did{margin-top:6px;color:#9fb486;font-size:12px}
  /* narrow screens: same bands, just wrapped */
  @media (max-width:700px){
    #wrap{padding:6px;max-width:none;min-width:0}
    #hudTop{flex-wrap:wrap;gap:6px 10px}
    #themeTxt{display:none}
    #stats{order:3;flex-basis:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px}
    #topBtns{margin-left:auto}
    #hudBottom{flex-direction:column;align-items:stretch}
    .rb{width:40px;height:40px;margin:-20px 0 0 -20px}
    #ov{position:fixed}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <div id="stage">
      <div id="hudTop" class="band">
        <div id="dayInfo"><span id="title">1일차</span><span id="themeTxt">물이 탁해졌다</span><span id="clock">06:00</span></div>
        <div id="stats"></div>
        <div id="topBtns"><button id="pauseBtn" class="ib" title="일시정지">⏸</button><button id="menuBtn" class="ib" title="날짜 선택">☰</button><button id="mute" class="ib" title="배경음악">♪ ON</button></div>
      </div>
      <canvas id="cv" width="800" height="480"></canvas>
      <div id="ring"></div><div id="cap"></div>
      <div id="dialog" class="band">
        <div id="mono"><span id="say"></span><span id="count"></span></div>
        <div id="log"></div>
        <div id="hudBottom">
          <div id="inv"><span class="lbl">배낭</span><div id="invList"></div></div>
          <div id="actions"></div>
        </div>
      </div>
      <div id="stats2"></div>
    </div>
    <div id="ov"><div class="card" id="ovCard"></div></div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=480;

// ---------- things to find ----------
// kind: 'use' = practical item, 'mem' = memory item (can be taken home or left)
const FINDS=[
  {id:'bottle',x:118,y:92,icon:'🧴',kind:'use',name:'찌그러진 페트병',
   text:'콘크리트 틈에 끼어 있던 페트병. 찌그러졌지만 구멍은 없다.\n물을 담을 수 있겠다. 오늘 가장 필요한 물건.'},
  {id:'can',x:300,y:262,icon:'🥫',kind:'use',name:'녹슨 통조림',
   text:'길가 덤불 아래 반쯤 묻혀 있었다. 라벨은 다 지워졌다.\n그래도 먹을 수는 있을 것이다.'},
  {id:'shoe',x:222,y:150,icon:'👟',kind:'mem',name:'작은 운동화',
   text:'아이 발만 한 운동화 한 짝.\n끈이 한쪽만 묶여 있다. 급하게 신다 만 것처럼.'},
  {id:'letter',x:66,y:165,icon:'✉️',kind:'mem',name:'젖은 편지',
   text:'번진 글씨를 겨우 읽었다.\n\n「수아야, 아빠가 먼저 북쪽 대피소에 가서 자리 잡아 둘게. 엄마 손 꼭 잡고 다음 버스 타. 무서우면 노래 불러. 아빠도 부를게.」'},
  {id:'sign',x:565,y:92,icon:'🚏',kind:'mem',name:'정류장 표지판 조각',
   text:'녹슨 철판에 글자가 남아 있다.\n\n「북쪽 대피소 행 · 막차 18:00」\n\n막차는 왔을까.'},
  {id:'watch',x:92,y:432,icon:'⌚',kind:'mem',name:'멈춘 손목시계',
   text:'나무뿌리에 감겨 있던 손목시계. 바늘이 4시 17분에 멈춰 있다.\n그날, 이 근방 시계는 모두 그 시간에 멈췄다.\n나도 기억한다. 아니, 기억하는 것 같다.'},
  {id:'drawing',x:628,y:405,icon:'🖍️',kind:'mem',name:'크레용 그림',
   text:'강가 바위 틈, 비닐에 싸인 종이 한 장.\n집과 해, 그리고 사람 셋. 가장 작은 사람 옆에 삐뚤빼뚤 「수아」라고 적혀 있다.'},
  {id:'musicbox',x:262,y:452,icon:'🎵',kind:'mem',name:'오르골',
   text:'흙을 털고 태엽을 감았다.\n몇 음이 흘러나오다 멈췄다.\n처음 듣는 곡인데, 다음 음을 알 것 같았다.'},
];
FINDS.push(
  {id:'umbrella',day:2,x:250,y:96,kind:'mem',name:'노란 우산',
   text:'무너진 벽 틈에 꽂혀 있던 아이용 우산. 노란 천은 바랬고 살이 두 개 부러졌다.\n펼치니 안쪽에 매직으로 쓴 이름.\n\n「3학년 2반 이수아」'},
  {id:'newspaper',day:2,at:17*60,x:452,y:318,kind:'mem',name:'날아온 신문 조각',
   text:'폭풍에 날려 와 쉼터 앞에 들러붙은 신문 조각. 젖어서 글자가 반쯤 지워졌다.\n\n「…북부 대피소 수용 인원 초과… 도착하지 못한 시민은 각 지역 임시 거처에서 구조를 기다리…」\n\n날짜는 그날의 다음 날이다.'}
);
const visible=f=>(f.day||1)<=S.day&&(!f.only||f.only.includes(S.day))&&(!f.at||S.t>=f.at);
const memTotal=()=>FINDS.filter(f=>f.kind==='mem'&&(f.day||1)<=S.day).length;

// ---------- state ----------
let S;
function fresh(){return{
  day:1, t:360, hp:80, food:55, water:45, mind:50, warm:90,
  inv:{bottle:false,bw:null,wood:0,can:0,cloth:false,lighter:false,cray:0,metal:0,grass:0,blanket:false}, // bw: water in bottle: null|'dirty'|'filtered'|'rain'|'boiled'
  found:{},          // id -> 'taken' | 'left' | 'placed' | 'used'
  carry:[],          // memory items in backpack
  placedOrder:[],
  car:0, barrel:false, bush:0, rock:false,
  fire:false, radio:0, signal:false,
  prep:{roof:false,floor:false,door:false}, storedWood:0, wet:false, wasWet:false, metalLeft:2, grassLeft:3, blanketTaken:false, barrelFull:false, stormMsgs:{}, flash:0, notes:[], fog:null, seenAreas:{},
  drankClean:0, drankDirty:0, drankRiver:0, sick:false, ateCan:0, berries:0, forest:0,
  p:{x:400,y:300,face:1,step:0}, target:null, running:false, ended:false, warnedDark:false
}}

// ---------- places ----------
const POI=[
  {id:'car',x:528,y:196,r:40,name:'녹슨 자동차'},
  {id:'barrel',x:488,y:296,r:26,name:'빗물통'},
  {id:'bush',x:332,y:300,r:28,name:'산딸기 덤불'},
  {id:'rock',x:606,y:332,r:26,name:'강가 바위'},
  {id:'forest',x:150,y:405,r:70,name:'숲'},
  {id:'river',x:660,y:240,r:0,name:'강가'},
  {id:'fire',x:400,y:345,r:42,name:'모닥불 자리'},
  {id:'radio',x:368,y:222,r:30,name:'낡은 라디오'},
  {id:'bed',x:436,y:222,r:30,name:'잠자리'},
  {id:'metal',day:2,x:205,y:70,r:30,name:'무너진 함석 지붕'},
  {id:'grass',day:2,x:520,y:388,r:30,name:'마른 풀밭'},
  {id:'shelter',day:2,x:400,y:246,r:22,name:'쉼터 안'},
];
function nearPOI(){
  const p=S.p;
  // undiscovered things take priority
  for(const f of FINDS){if(!S.found[f.id]&&visible(f)&&Math.hypot(p.x-f.x,p.y-f.y)<34)return{id:'find',find:f,name:'무언가 있다'}}
  if(p.x>628)return POI.find(o=>o.id==='river');
  let best=null,bd=1e9;
  for(const o of POI){if(o.id==='river'||(o.day||1)>S.day||(o.only&&!o.only.includes(S.day)))continue;const d=Math.hypot(p.x-o.x,p.y-o.y);if(d<o.r&&d<bd){bd=d;best=o}}
  return best;
}
const inShelter=()=>S.p.x>338&&S.p.x<462&&S.p.y>184&&S.p.y<268;

function actionsFor(o){
  const I=S.inv,a=[];
  if(!o)return a;
  switch(o.id){
    case 'find':
      a.push({label:'살펴보기',cost:10,ok:true,fn:()=>showFind(o.find)});break;
    case 'car':
      if(S.car===0)a.push({label:'트렁크 열어 보기',cost:20,ok:true,fn:()=>{S.car=1;I.cloth=true;log('녹슨 트렁크를 힘껏 들어 올렸다. 곰팡내 나는 담요 사이에서 쓸 만한 헝겊을 찾았다. (헝겊 획득)')}});
      else if(S.car===1)a.push({label:'운전석 살펴보기',cost:15,ok:true,fn:()=>{S.car=2;I.lighter=true;S.mind=Math.min(100,S.mind+3);log('글러브박스 안에 일회용 라이터. 몇 번 그으니 작은 불꽃이 인다. 아직 가스가 남아 있다. (라이터 획득)')}});
      else a.push({label:'운전석에 앉아 보기',cost:10,ok:true,fn:()=>{S.mind=Math.min(100,S.mind+2);log('운전석에 앉아 금 간 유리 너머를 봤다. 이 길 끝엔 뭐가 있었을까.')}});
      if(S.day>=2&&!S.blanketTaken)a.unshift({label:'뒷좌석 담요 꺼내기',cost:15,ok:true,fn:()=>{S.blanketTaken=true;I.blanket=true;log('뒷좌석에서 곰팡내 나는 담요를 꺼냈다. 털어 보니 아직 두툼하다. (담요 획득)')}});
      break;
    case 'barrel':
      if(S.barrelFull)a.push({label:'빗물 병에 담기',cost:5,ok:I.bottle&&!I.bw,why:I.bottle?'병이 이미 차 있다':'담을 그릇이 없다',fn:()=>{I.bw='rain';log('빗물통이 가득 찼다. 병을 넘치도록 채웠다.')}});
      else if(!S.barrel)a.push({label:'빗물 병에 담기',cost:10,ok:I.bottle&&!I.bw,why:I.bottle?'병이 이미 차 있다':'담을 그릇이 없다',fn:()=>{S.barrel=true;I.bw='rain';log('어젯밤 비가 통에 조금 고여 있었다. 병 하나를 겨우 채웠다. 맑다.')}});
      else a.push({label:'들여다보기',cost:5,ok:true,fn:()=>log('통 바닥이 말라 있다. 다음 비를 기다려야 한다.')});
      break;
    case 'bush':
      a.push({label:'덤불 헤치기',cost:15,ok:S.bush<2,why:'남은 열매가 없다',fn:()=>{S.bush++;S.food=Math.min(100,S.food+10);S.berries++;log(S.bush===1?'가시에 손등이 긁혔지만, 잘 익은 산딸기를 한 줌 땄다. (식량 +10)':'안쪽 깊숙이 남은 몇 알을 마저 땄다. (식량 +10)')}});
      break;
    case 'rock':
      a.push({label:'바위 들춰 보기',cost:15,ok:!S.rock,why:'이미 들춰 봤다',fn:()=>{S.rock=true;I.cray++;log('바위를 굴리자 작은 가재 한 마리가 허둥댄다. 재빨리 잡았다. 불에 구우면 먹을 수 있겠다. (가재 획득)')}});
      break;
    case 'forest':
      a.push({label:'마른 가지 줍기',cost:20,ok:true,fn:gather});break;
    case 'river':
      a.push({label:'병에 강물 담기',cost:10,ok:I.bottle&&!I.bw,why:I.bottle?'병이 이미 차 있다':'담을 그릇이 없다',fn:()=>{I.bw='dirty';log('흙빛 강물을 병에 담았다. 냄새가 난다.')}});
      if(I.cloth)a.push({label:'헝겊으로 걸러 담기',cost:25,ok:I.bottle&&!I.bw,why:I.bottle?'병이 이미 차 있다':'담을 그릇이 없다',fn:()=>{I.bw='filtered';log('헝겊을 병 입구에 대고 천천히 물을 걸렀다. 흙은 대부분 걸러졌다.')}});
      a.push({label:'강물 그냥 마시기',cost:5,ok:true,fn:()=>{S.water=Math.min(100,S.water+25);S.hp-=12;S.drankRiver++;S.sick=true;log('목은 축였지만 속이 뒤틀린다. (체력 -12, 배탈)')}});
      break;
    case 'fire':
      if(!S.fire&&stormLevel()>.1)a.push({label:'불 피우기',cost:0,ok:false,why:'비가 퍼붓는다',fn:()=>{}});
      else if(!S.fire&&S.day>=3)fireBuildActions(a);
      else if(!S.fire){
        if(I.lighter)a.push({label:'라이터로 불 피우기 (땔감 2)',cost:10,ok:I.wood>=2,why:'땔감이 부족하다',fn:lightFire});
        else a.push({label:'나무 비벼 불 피우기 (땔감 2)',cost:60,ok:I.wood>=2,why:'땔감이 부족하다',fn:()=>{S.mind=Math.max(0,S.mind-3);lightFire();log('한 시간을 비벼서야 연기가 났다. 손바닥이 얼얼하다. (정신력 -3)')}});
      }
      a.push({label:'물 끓이기',cost:25,ok:S.fire&&!!I.bw&&I.bw!=='boiled',why:S.fire?'끓일 물이 없다':'불이 없다',fn:()=>{I.bw='boiled';log('물을 오래 끓였다. 김이 오르는 걸 한참 바라봤다.')}});
      if(I.cray)a.push({label:'가재 구워 먹기',cost:15,ok:S.fire,why:'불이 없다',fn:()=>{I.cray--;S.food=Math.min(100,S.food+18);S.mind=Math.min(100,S.mind+3);log('가재가 붉게 익었다. 한 입 거리지만 따뜻한 음식이다. (식량 +18)')}});
      break;
    case 'metal':
      a.push({label:'함석판 뜯어내기',cost:30,ok:S.metalLeft>0,why:'더 뜯을 게 없다',fn:()=>{S.metalLeft--;I.metal++;log(S.metalLeft?'녹슨 함석판 한 장을 비틀어 뜯어냈다. 손바닥이 얼얼하다. (함석판 +1)':'마지막 한 장을 뜯어냈다. 이 정도면 지붕 구멍을 덮을 수 있다. (함석판 +1)')}});break;
    case 'grass':
      a.push({label:'마른 풀 베기',cost:20,ok:S.grassLeft>0,why:'남은 마른 풀이 없다',fn:()=>{S.grassLeft--;I.grass++;log(stormLevel()>.1?'젖은 풀뿐이다. 그래도 한 아름 베었다. (마른 풀 +1)':'비 오기 전에 마른 풀을 한 아름 베었다. 바스락거린다. (마른 풀 +1)')}});break;
    case 'shelter':
      if(!S.prep.roof)a.push({label:'지붕 틈 막기 (함석판 2)',cost:40,ok:I.metal>=2,why:'함석판이 부족하다',fn:()=>{I.metal-=2;S.prep.roof=true;log('함석판으로 지붕 구멍을 덮고 돌로 눌러 두었다. 이제 비가 새지 않을 것이다.')}});
      if(!S.prep.floor)a.push({label:'바닥에 마른 풀 깔기 (풀 2)',cost:30,ok:I.grass>=2,why:'마른 풀이 부족하다',fn:()=>{I.grass-=2;S.prep.floor=true;log('잠자리 밑에 마른 풀을 두툼하게 깔았다. 땅의 냉기가 덜 올라온다.')}});
      if(!S.prep.door)a.push({label:'입구에 담요 걸기',cost:15,ok:I.blanket,why:'걸 만한 천이 없다',fn:()=>{I.blanket=false;S.prep.door=true;log('입구에 담요를 걸었다. 바람이 한결 덜 들이친다.')}});
      if(I.wood>0)a.push({label:`땔감 안에 들여놓기 (${I.wood})`,cost:10,ok:true,fn:()=>{S.storedWood+=I.wood;I.wood=0;log('땔감을 쉼터 구석에 쌓았다. 비 맞은 나무는 불이 안 붙는다.')}});
      if(S.wet)a.push({label:'젖은 옷 벗어 말리기',cost:40,ok:true,fn:()=>{S.wet=false;S.mind=Math.min(100,S.mind+3);log('젖은 옷을 벗어 짜서 널고, 마른 옷으로 갈아입었다. 떨림이 조금 잦아든다.')}});
      break;
    case 'radio':
      a.push({label:'라디오 켜기',cost:20,ok:true,fn:useRadio});break;
    case 'bed':
      a.push({label:'잠들기 (하루 마치기)',cost:0,ok:S.t>=15*60,why:'아직 해가 높다 (15시 이후)',fn:()=>endDay(false)});
      a.push({label:'쉬며 기다리기 (1시간)',cost:60,ok:S.t<29*60,why:'곧 날이 밝는다',fn:()=>{emote('zz',2500);S.mind=Math.min(100,S.mind+2);log(stormLevel()>.2?'빗소리를 들으며 한 시간쯤 누워 있었다.':S.t>=19*60?'어둠 속에 누워 한 시간쯤 숨을 골랐다.':'잠자리에 누워 한 시간쯤 쉬었다. 천장 틈으로 빛이 움직인다.')}});
      break;
  }
  DAY_HOOKS.actions.forEach(f=>f(o,a));
  return a;
}
function gather(){
  if(S.day>=3&&DAY_HOOKS.gather){DAY_HOOKS.gather();return}
  S.forest++;S.inv.wood++;
  log(S.forest===1?'바닥에 떨어진 마른 가지를 모았다. (땔감 +1)':S.forest===2?'부러진 가지를 한 아름 더 주웠다. (땔감 +1)':'마른 가지를 모았다. (땔감 +1)');
}
function lightFire(){emote('♥');S.inv.wood-=2;S.fire=true;S.mind=Math.min(100,S.mind+6);log('불이 붙었다. 타닥거리는 소리가 이상하게 위로가 된다. (정신력 +6)')}
// drinking from the bottle works anywhere
function drinkActions(){
  const I=S.inv,a=[];
  if(!I.bw)return a;
  const D={
    boiled:{label:'끓인 물 마시기',w:40,hp:0,msg:'미지근하지만 깨끗한 물. 살 것 같다. (물 +40)'},
    rain:{label:'빗물 마시기',w:35,hp:0,msg:'차갑고 맑다. 하늘이 준 물. (물 +35)'},
    filtered:{label:'걸러낸 물 마시기',w:30,hp:-3,msg:'흙맛이 조금 남았지만 마실 만하다. (물 +30, 체력 -3)'},
    dirty:{label:'탁한 물 마시기',w:30,hp:-10,sick:true,msg:'참지 못하고 들이켰다. 곧 배가 아파 온다. (물 +30, 체력 -10)'},
  }[I.bw];
  a.push({label:D.label,cost:5,ok:true,fn:()=>{S.water=Math.min(100,S.water+D.w);S.hp+=D.hp;if(D.sick){S.sick=true;S.drankDirty++;emote('sweat')}else{S.drankClean++;emote('♥')}S.lastDrink=I.bw;I.bw=null;log(D.msg)}});
  return a;
}
function useRadio(){
  S.radio++;
  emote(S.radio===0?'!':'note');
  if(S.radio===1){S.signal=true;S.mind=Math.min(100,S.mind+8);log('지지직… 잡음 사이로 무언가 들렸다. "…여기는… 북쪽…" 그리고 끊겼다. (정신력 +8)')}
  else {S.mind=Math.min(100,S.mind+2);log('다시 다이얼을 돌려 봤지만 잡음뿐이다. 그래도 소리가 있다는 게 좋다.')}
}
function eatCan(){
  if(!S.inv.can||!S.running)return;
  emote('♥');
  Sfx.play('eat');S.inv.can--;S.ateCan++;S.food=Math.min(100,S.food+30);advance(10);
  log('칼로 통조림을 땄다. 정체 모를 콩 요리. 맛은 상관없다. (식량 +30)');

// ---------- discovery card ----------
function showFind(f){
  S.running=false;
  const EM={letter:'…',newspaper:'…',sign:'?',watch:'…',shoe:'…',drawing:'♥',musicbox:'note',umbrella:'…'};
  if(f.id==='musicbox')Music.musicBox();
  const btns=f.kind==='note'?`<button id="c1">눈에 담는다</button>`:f.kind==='use'
    ? `<button id="c1">챙긴다</button>`
    : `<button id="c1">가져간다</button><button id="c2" class="ghost">그 자리에 둔다</button>`;
  card.innerHTML=`<div class="icon">${iconImg(f.id,70)}</div><h2 style="text-align:center">${f.name}</h2>
  <div class="paper">${f.text}</div><div class="btns" style="justify-content:center">${btns}</div>`;
  ov.classList.remove('hide');
  const close=(em)=>{ov.classList.add('hide');S.running=true;dirtyUI=true;if(em)emote(em,2200)};
  document.getElementById('c1').onclick=()=>{
    Sfx.play('pick');
    if(f.kind==='note'){S.found[f.id]='seen';S.mind=Math.min(100,S.mind+4);log(`${f.name}을(를) 한참 바라봤다. 글자 하나하나를 외웠다.`);close('…');return}
    if(f.id==='bottle'){S.found.bottle='used';S.inv.bottle=true;log('페트병을 챙겼다. 이제 물을 담을 수 있다.')}
    else if(f.id==='can'){S.found.can='used';S.inv.can++;log('통조림을 배낭에 넣었다.')}
    else{S.found[f.id]='taken';S.carry.push(f.id);S.mind=Math.min(100,S.mind+6);log(`${f.name}을(를) 배낭에 넣었다. 쉼터에 가져다 두자. (정신력 +6)`)}
    close(EM[f.id]||'!');
  };
  const c2=document.getElementById('c2');
  if(c2)c2.onclick=()=>{Sfx.play('leave');S.found[f.id]='left';S.mind=Math.min(100,S.mind+2);log(`${f.name}은(는) 그 자리에 두었다. 여기가 그것의 자리 같았다.`);close('…')};
}
function placeCarried(){
  if(!S.carry.length)return;
  Sfx.play('place');
  for(const id of S.carry){
    S.found[id]='placed';S.placedOrder.push(id);S.mind=Math.min(100,S.mind+4);
    const f=FINDS.find(x=>x.id===id);
    const where=({umbrella:'벽에 기대어 펼쳐',newspaper:'선반 위에 펴서',shoe:'문가에',letter:'선반 위에',sign:'벽에 기대어',watch:'벽에 걸어',drawing:'잠자리 옆에',musicbox:'머리맡에'})[id]||'선반 위에';
    log(`${f.name}을(를) ${where} 두었다. 쉼터가 조금 덜 비어 보인다. (정신력 +4)`);
  }
  S.carry=[];dirtyUI=true;emote('♥');
}

// ---------- weather ----------
function stormLevel(){if(!S||S.day!==2)return 0;const h=S.t/60;if(h<15)return 0;if(h<16)return h-15;if(h<20)return 1;return Math.max(.6,1-(h-20)*.4)}
function cloudLevel(){if(!S||S.day!==2)return 0;return Math.max(0,Math.min(1,(S.t/60-10)/5))}

// ---------- time & stats ----------
function advance(m){
  S.t+=m;
  if(S.day===2){
    const h=S.t/60,M=S.stormMsgs,say=(k,msg)=>{if(!M[k]){M[k]=1;log(msg);return true}return false};
    if(h>=11)say('a','바람이 거세진다. 나뭇가지가 휘청인다.');
    if(h>=13.5)say('b','서쪽 하늘이 시커멓다. 곧 쏟아질 것 같다.');
    if(h>=15&&say('c','후드득— 비가 쏟아지기 시작했다!')&&(emote('!'),S.fire)){S.fire=false;log('비가 모닥불을 꺼 버렸다.')}
    if(h>=15.5&&say('d','빗물통에 빗물이 차오르는 소리가 들린다.'))S.barrelFull=true;
    if(h>=16)say('e','폭풍이다. 바람이 쉼터를 통째로 흔든다.');
  }
  DAY_HOOKS.tick.forEach(f=>f(m));
  if(S.day>=2){
    const st=stormLevel(),inside=inShelter();let loss=0,gain=0;
    if(st>0&&!inside){loss+=.35*st;if(!S.wet&&st>.2){S.wet=true;S.wasWet=true;emote('drop');log('비에 흠뻑 젖었다. 몸이 빠르게 식는다.')}}
    else if(st>0){loss+=st*((S.prep.roof?0:.12)+(S.prep.door?0:.08)+(S.prep.floor?0:.07));
      if(!S.prep.roof&&st>.5&&!S.wet&&Math.random()<.003*m){S.wet=true;S.wasWet=true;log('지붕 구멍으로 쏟아진 빗물에 옷이 다 젖었다.')}}
    else if(!inside&&S.t>=11*60)loss+=.03;
    if(S.wet)loss+=.12;
    if(inside&&!S.wet&&(st===0||(S.prep.roof&&S.prep.door&&S.prep.floor)))gain+=.06;
    S.warm=Math.max(0,Math.min(100,S.warm+(gain-loss)*m));
    if(S.warm<=0)S.hp-=.1*m;
    if(S.warm<30)S.mind-=.03*m;
    if((S.wet||S.warm<30)&&Math.random()<.006*m&&!(S.emote&&performance.now()<S.emote.until))emote('drop');
  }
  S.water-=0.035*m; S.food-=0.022*m; S.mind-=(S.t>=23*60?0.03:0.012)*m;
  if(S.sick)S.hp-=0.012*m;
  if((S.water<15||S.food<15)&&Math.random()<.004*m&&!(S.emote&&performance.now()<S.emote.until))emote('sweat');
  if(S.water<=0){S.water=0;S.hp-=0.05*m}
  if(S.food<=0){S.food=0;S.hp-=0.03*m}
  if(S.mind<=0){S.mind=0;S.hp-=0.02*m}
  S.hp=Math.min(100,S.hp);
  if(S.hp<=0){S.hp=0;gameOver();return}
  if(S.t>=20*60&&!S.warnedDark){S.warnedDark=true;log('해가 졌다. 쉼터 잠자리에서 잠들면 하루가 끝난다. 서두를 필요는 없다.')}
  if(S.t>=24*60&&!S.warnedLate){S.warnedLate=true;log('자정이 넘었다. 밤공기가 차다.')}
  if(S.t>=29.5*60){S.t=29.5*60;if(!S.warnedDawn){S.warnedDawn=true;log('곧 동이 튼다. 이제는 잠들어야 할 것 같다.')}}
}
function doAction(a){
  if(!S.running||!a||!a.ok)return;
  const sn=SND.find(([k])=>a.label.includes(k));if(sn)Sfx.play(sn[1]);
  a.fn();
  if(S.running)advance(a.cost);else if(!S.ended)S.t+=a.cost;
  dirtyUI=true;
}

// ---------- monologue (soft guidance) ----------
function monologue2(){
  const I=S.inv,P=S.prep;let s;
  if(S.t<15*60){
    if(!P.roof)s=I.metal>=2?'함석판이 있다. 쉼터 안에서 지붕 틈을 막자.':`지붕에 구멍이 났다. 무너진 건물에서 함석판을 뜯어 오자. (${I.metal}/2)`;
    else if(!P.floor)s=I.grass>=2?'마른 풀을 쉼터 바닥에 깔자. 땅이 체온을 빼앗는다.':`바닥이 차다. 강가 풀밭에서 마른 풀을 베어 오자. (${I.grass}/2)`;
    else if(!P.door)s=I.blanket?'담요를 입구에 걸어 바람을 막자.':'입구로 바람이 들이친다. 차 뒷좌석에 담요가 있었던 것 같다.';
    else if(!S.storedWood)s=I.wood?'땔감을 쉼터 안에 들여놓자. 젖으면 내일 불을 못 피운다.':'마른 땔감을 미리 주워 쉼터 안에 들여놓자.';
    else s='준비는 끝났다. 비가 오기 전에 물과 먹을 것도 챙겨 두자.';
    if(S.t>=13.5*60)s='먹구름이 몰려온다. 서둘러야 한다. '+s;
  }else{
    if(!inShelter())s='비가 쏟아진다! 쉼터로 돌아가자.';
    else if(S.wet)s='온몸이 젖었다. 젖은 옷부터 벗어 말려야 한다.';
    else if(!P.roof)s='지붕에서 물이 샌다. 오늘 밤은 길 것 같다.';
    else if(!P.floor||!P.door)s='바닥과 입구로 냉기가 스민다. 몸을 웅크리자.';
    else s='빗소리가 지붕을 두드린다. 여기 있으면 괜찮다.';
    const np=FINDS.find(f=>f.id==='newspaper');if(visible(np)&&!S.found.newspaper)s+=' 문 앞에 뭔가 날아와 붙었다.';
  }
  if(S.carry.length&&S.t<15*60)s+=' 배낭 속 물건은 쉼터에 가져다 두자.';
  const ck=v=>v?'✓':'✗';
  return {s,count:`대비 — 지붕 ${ck(P.roof)} · 바닥 ${ck(P.floor)} · 입구 ${ck(P.door)} · 땔감 ${ck(S.storedWood)}`};
}
function monologue(){
  if(S.day===2)return monologue2();
  if(MONO[S.day])return MONO[S.day]();
  const I=S.inv,mem=FINDS.filter(f=>f.kind==='mem'&&S.found[f.id]).length;
  let s;
  if(S.t>=18*60)s=S.t>=20*60?'밤이다. 더 둘러봐도 되고, 쉼터에 누워 하루를 마쳐도 된다.':'해가 기운다. 어두워지기 전에 쉼터 쪽으로 돌아가자.';
  else if(!I.bottle&&!S.drankClean)s='강물이 흙빛이다. 물을 담을 그릇부터 찾아야겠다. 무너진 건물 쪽에서 뭔가 반짝였다.';
  else if(!S.drankClean&&!I.bw&&!S.barrel)s='병은 구했다. 어젯밤 비가 쉼터 옆 통에 고였을지도. 아니면 강물을 떠다 끓이거나.';
  else if(!S.drankClean&&!I.bw)s='강물을 떠 오자. 그냥은 못 마신다. 끓이든, 거르든.';
  else if(!S.drankClean&&I.bw==='dirty'&&!S.fire&&I.wood<2)s='흙탕물이다. 끓이려면 숲에서 마른 가지를 주워 와야 한다.';
  else if(!S.drankClean&&I.bw==='dirty'&&!S.fire)s=I.lighter?'땔감은 됐다. 모닥불 자리에서 라이터로 불을 붙이자.':'땔감은 됐다. 불씨가 없으니 비벼야 하나… 길가 차 안에 뭔가 있을지도.';
  else if(!S.drankClean&&I.bw==='dirty')s='불이 있다. 끓이면 마실 수 있을 것이다.';
  else if(!S.drankClean&&I.bw)s='물이 있다. 목부터 축이자.';

const FW=100,FH=60,FCELL=8; // one fog cell = 8 world px = 4 buffer px

const FOGJIT=new Array(FW*FH).fill(0).map((_,i)=>((i*2654435761)>>>0)%5-2);
function newFog(){const f=new Array(FW*FH).fill(0);revealOn(f,400,262,15);return f}
function revealOn(f,wx,wy,r){
  const cx=wx/FCELL,cy=wy/FCELL,R=r+4;
  for(let y=Math.max(0,cy-R|0);y<=Math.min(FH-1,cy+R|0);y++)for(let x=Math.max(0,cx-R|0);x<=Math.min(FW-1,cx+R|0);x++){
    const i=y*FW+x,d=Math.hypot(x+.5-cx,y+.5-cy)+FOGJIT[i]*.5;
    const v=d<r?15:Math.max(0,Math.round(15*(1-(d-r)/4)));if(v>f[i])f[i]=v;
  }
}

const titleEl=document.getElementById('title'),themeEl=document.getElementById('themeTxt');
let dayStart=null;
function startDay(n){
  if(n===1){S=fresh();S.fog=newFog()}
  else{
    S.day=n;S.t=360;S.ended=false;S.running=false;S.warnedDark=false;S.warnedLate=false;S.warnedDawn=false;S.stormMsgs={};
    S.water=Math.max(15,S.water-12);S.food=Math.max(15,S.food-10);S.hp=Math.min(100,S.hp+10);S.mind=Math.max(20,S.mind);
    S.sick=false;S.fire=false;S.bush=0;S.rock=false;S.barrel=true;S.barrelFull=false;
    S.warm=80;S.wet=false;S.p={x:400,y:236,face:1,step:0};S.target=null;S.carry.forEach(id=>{S.found[id]='placed';S.placedOrder.push(id)});S.carry=[];
    (ON_START[n]||(()=>{}))();
  }
  dayStart=JSON.stringify(S,(k,v)=>(k==='_pctT'||k==='emote')?undefined:v);
  beginDay();
}
function retryDay(){S=JSON.parse(dayStart);beginDay()}
function beginDay(){
  const D=DAYS[S.day];
  logEl.innerHTML='';dirtyUI=true;lastSay='';
  titleEl.textContent=`${S.day}일차`;themeEl.textContent=D.theme;
  card.innerHTML=D.intro()+`<div class="btns"><button id="go">하루 시작하기</button><button id="back" class="ghost">← 날짜 선택</button></div>`;
  ov.classList.remove('hide');
  document.getElementById('back').onclick=()=>showTitle(false);
  document.getElementById('go').onclick=()=>{Music.start();Sfx.play('start');ov.classList.add('hide');S.running=true;log(D.wake);renderUI()};
}
function journal1(forced,home){
  const st=id=>S.found[id],has=id=>st(id)==='placed'||st(id)==='taken',seen=id=>!!st(id);
  const L=['1일차.'];
  if(S.lastDrink==='rain')L.push('강물이 흙빛이었다. 다행히 통에 빗물이 고여 있었다. 하늘이 한 번 봐준 셈이다.');
  else if(S.lastDrink==='filtered')L.push('강물이 흙빛이었다. 차에서 찾은 헝겊으로 걸러 마셨다. 흙맛은 났지만 버틸 만했다.');
  else if(S.drankClean)L.push('강물이 흙빛이었다. 주운 병에 물을 담아 끓였다. 끓인 물이 이렇게 달 줄은 몰랐다.');
  else if(S.drankDirty||S.drankRiver)L.push('강물이 흙빛이었다. 참지 못하고 그냥 마셨다. 배 속이 계속 뒤틀린다.');
  else L.push('강물이 흙빛이었다. 결국 물을 한 모금도 마시지 못했다.');
  if(has('shoe'))L.push('작은 운동화를 문가에 두었다. 끈 한쪽은 풀린 채로.');
  if(has('watch'))L.push('멈춘 시계를 벽에 걸었다. 4시 17분. 이제 이 방에도 그 시간이 있다.');
  if(has('musicbox'))L.push('오르골을 머리맡에 두었다. 잠들기 전에 한 번 더 감아 볼 생각이다.');
  if(seen('letter')&&seen('drawing'))L.push('편지와 그림 속 아이의 이름은 수아. 몇 번이고 소리 내어 불러 봤다. 이상하게, 입에 익었다.');
  else if(seen('letter'))L.push('편지 속 아이의 이름은 수아였다. 아빠는 먼저 북쪽으로 갔다고 했다.');
  else if(seen('drawing'))L.push('그림 속 가장 작은 사람, 수아. 누구였을까.');
  const north=[S.signal&&'라디오',seen('letter')&&'편지',seen('sign')&&'표지판'].filter(Boolean);
  if(north.length>=2)L.push(`${north.join('에도, ')}에도 '북쪽'이 있었다.`);
  else if(seen('sign'))L.push('북쪽 대피소 행 막차, 18시. 막차는 왔을까.');
  if(FINDS.some(f=>st(f.id)==='left'))L.push('두고 온 것도 있다. 내일 다시 보러 가도 될 것이다.');
  if(forced&&!home)L.push('어둠 속에서 길을 잃을 뻔했다. 겨우 쉼터로 돌아왔다.');
  if(!FINDS.some(f=>f.kind==='mem'&&seen(f.id)))L.push('오늘은 물만 생각했다. 쉼터가 여전히 휑하다.');
  return L;
}
function journal2(forced,home){
  const P=S.prep,seen=id=>!!S.found[id];
  const L=['2일차.'];
  if(P.roof&&P.floor&&P.door)L.push('지붕을 막고, 바닥에 풀을 깔고, 입구에 담요를 걸었다. 바깥은 폭풍인데 안은 견딜 만했다.');
  else{
    if(!P.roof)L.push('지붕 구멍으로 밤새 빗물이 떨어졌다. 구석에 웅크려 겨우 잤다.');
    if(!P.floor)L.push('바닥에서 냉기가 올라왔다. 땅이 이렇게 차가운 줄 몰랐다.');
    if(!P.door)L.push('입구로 바람이 계속 들이쳤다.');
  }
  if(S.wasWet)L.push('비에 젖은 채로 한참 떨었다. 젖으면 몸이 금방 식는다는 걸 뼈저리게 배웠다.');

  if(forced&&!home)L.push('폭풍 속에서 쉼터를 찾느라 한참을 헤맸다.');

function endDay(forced){
  if(S.ended)return;
  if(inShelter())placeCarried();
  S.ended=true;S.running=false;Sfx.play('night');
  const home=inShelter();
  if(forced&&!home){S.mind=Math.max(0,S.mind-8)}
  const L=(JOURNAL[S.day]||journal2)(forced,home);
  const N=NOTES[S.day];if(!S.notes.includes(S.day))S.notes.push(S.day);
  const placed=S.placedOrder.map(id=>FINDS.find(f=>f.id===id));

  const nx=WEEK.find(w=>w.d===S.day+1);
  const next=S.day<7
    ?`<p class="small">내일의 주제 — <b style="color:var(--accent)">${S.day+1}일차: ${nx.theme}</b>${nx.ready?'':' (아직 준비 중)'}</p><div class="btns">${nx.ready?`<button id="next">${S.day+1}일차로 넘어가기</button>`:''}<button id="again" class="ghost">${S.day}일차 다시 하기</button><button id="pick" class="ghost">날짜 선택</button></div>`
    :`<div class="btns"><button id="ending">이야기의 끝으로</button><button id="again" class="ghost">7일차 다시 하기</button><button id="pick" class="ghost">날짜 선택</button></div>`;
  card.innerHTML=`<h2>밤 — 생존 일지</h2><div class="sub">${S.day}일차 · 발견한 기억 ${memCount}/${memTotal()}</div>
  <div class="paper">${L.map(l=>`<p>${l}</p>`).join('')}</div>
  <div class="note"><div class="nh">📖 생존 수첩 ${S.day}쪽 — ${N.title}</div><ul>${N.body.map(b=>`<li>${b}</li>`).join('')}</ul><div class="did">오늘 직접 해 본 것: ${N.did()}</div></div>
  ${placed.length?`<p class="small" style="text-align:center;margin-bottom:0">쉼터에 놓인 것</p><div class="shelf">${placed.map(f=>iconImg(f.id,36)).join(' ')}</div>`:''}
  <p class="small">체력 ${Math.round(S.hp)} · 식량 ${Math.round(S.food)} · 물 ${Math.round(S.water)}${S.day>=2?' · 체온 '+Math.round(S.warm):''} · 정신력 ${Math.round(S.mind)}</p>
  ${next}`;
  ov.classList.remove('hide');
  const $=id=>document.getElementById(id);
  if($('next'))$('next').onclick=()=>startDay(S.day+1);
  if($('ending'))$('ending').onclick=showEnding;
  if($('again'))$('again').onclick=retryDay;
  if($('restart'))$('restart').onclick=()=>startDay(1);
  if($('pick'))$('pick').onclick=()=>showTitle(false);
}
function gameOver(){
  if(S.ended)return;S.ended=true;S.running=false;Sfx.play('fall');

// a reasonable "yesterday" for starting a later day directly
function presetFor(n){
  S=fresh();S.fog=newFog();
  if(n>=2){
    S.inv.bottle=true;S.found.bottle='used';S.lastDrink='boiled';S.drankClean=1;S.notes=[1];
    S.car=1;S.inv.cloth=true;S.signal=true;S.radio=1;
    [[300,200],[200,130],[130,90],[250,330],[160,400],[110,440],[520,280],[620,240],[640,330]].forEach(([x,y])=>revealOn(S.fog,x,y,12));
    S.seenAreas={ruins:1,forest:1,river:1};
    S.food=50;S.water=55;S.mind=55;S.hp=80;
  }
  for(let d=3;d<=n;d++)(PRESET[d]||(()=>{}))();
}
function showTitle(fromGame){
  const inGame=fromGame&&S&&!S.ended&&S.running&&ov.classList.contains('hide');
  if(inGame)S.running=false;
  card.innerHTML=`<h2>마지막 사람</h2><div class="sub">멸망 후 50년 · 하루에 하나씩 배우는 생존</div>
  <p class="small">날짜를 골라 시작하세요. 1일차부터 하면 전날의 상태가 다음 날로 이어집니다.<br>중간 날짜부터 고르면 '전날을 무난히 보낸' 상태로 시작해요.</p>
  <div class="daylist">${WEEK.map(w=>`<button ${w.ready?'':'disabled'} data-d="${w.d}" class="${w.ready?'':'ghost'}"><span><span class="d">${w.d}일차</span>${w.theme}</span><span class="sk">${w.ready?w.skill:'준비 중'}</span></button>`).join('')}</div>
  ${inGame?`<div class="btns"><button id="resume" class="ghost">← 하던 날 계속하기</button></div>`:''}`;
  ov.classList.remove('hide');
  card.querySelectorAll('.daylist button[data-d]').forEach(b=>{b.onclick=()=>{const n=+b.dataset.d;Sfx.play('pick');if(n===1)startDay(1);else{presetFor(n);startDay(n)}}});
  const r=document.getElementById('resume');if(r)r.onclick=()=>{ov.classList.add('hide');S.running=true;dirtyUI=true};
}
document.getElementById('pauseBtn').onclick=e=>{
  e.currentTarget.blur();
  if(!S||S.ended||!S.running||!ov.classList.contains('hide'))return;
  S.running=false;
  card.innerHTML=`<h2>잠시 멈춤</h2><div class="sub">${S.day}일차 · ${fmt(S.t)}</div><p class="small">시간이 멈춰 있습니다. 준비되면 이어서 하세요.</p><div class="btns"><button id="unpause">계속하기</button></div>`;
  ov.classList.remove('hide');
  document.getElementById('unpause').onclick=()=>{ov.classList.add('hide');S.running=true;dirtyUI=true};
};
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'){const u=document.getElementById('unpause');if(u&&!ov.classList.contains('hide'))u.click();else document.getElementById('pauseBtn').click()}});
document.getElementById('menuBtn').onclick=e=>{Music.start();showTitle(true);e.currentTarget.blur()};
S=fresh();S.fog=newFog();
showTitle(false);
requestAnimationFrame(frame);
})();
