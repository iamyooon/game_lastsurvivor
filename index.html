<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마지막 사람 — 1일차 프로토타입</title>
<style>
  :root{--bg:#14161a;--panel:#1d2026;--line:#2c3038;--text:#e8e4da;--dim:#9a968c;--accent:#e0a458}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #wrap{max-width:820px;margin:0 auto;padding:12px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
  header .theme{color:var(--accent);font-size:14px}
  #clock{font-variant-numeric:tabular-nums;font-size:15px;color:var(--dim)}
  #stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
  .stat .row{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--dim)}
  .stat .row b{color:var(--text);font-weight:600}
  .bar{height:6px;background:#2a2d34;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;transition:width .2s}
  #mono{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  #mono .say{font-family:"Nanum Myeongjo",Georgia,serif;font-style:italic;color:#d9d3c4;line-height:1.5}
  #mono .count{color:var(--dim);font-size:12px;white-space:nowrap}
  #cv{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);touch-action:none;background:#2d3b26}
  #hud{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;align-items:flex-start}
  #inv{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;min-height:44px}
  #inv .lbl{color:var(--dim);font-size:11px;margin-bottom:4px}
  #inv span.item{display:inline-block;background:#2a2d34;border-radius:5px;padding:2px 7px;margin:2px 4px 2px 0}
  #actions{flex:2 1 300px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:44px}
  #actions .where{width:100%;font-size:12px;color:var(--dim)}
  button{font:inherit;font-size:14px;background:#3a2f22;color:var(--text);border:1px solid #6b5536;border-radius:7px;padding:8px 12px;cursor:pointer}
  button:hover:not(:disabled){background:#4a3b29}
  button:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
  button .k{color:var(--accent);font-size:11px;margin-right:5px}
  #log{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;height:96px;overflow-y:auto;line-height:1.55}
  #log p{margin:0}
  #log p:first-child{color:var(--text)}
  #log p:not(:first-child){color:var(--dim)}
  #help{font-size:11px;color:var(--dim);margin-top:6px}
  #ov{position:fixed;inset:0;background:rgba(8,9,11,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  #ov.hide{display:none}
  .card{max-width:500px;width:100%;background:#1b1d22;border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;line-height:1.7;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card h2{margin:0 0 4px;font-size:22px}
  .card .sub{color:var(--accent);font-size:13px;margin-bottom:14px}
  .card p{margin:0 0 10px;font-size:14px}
  .card .icon{font-size:52px;text-align:center;margin:4px 0 8px}
  .card .paper{background:#e9e1cf;color:#2b261d;border-radius:6px;padding:14px 16px;font-family:"Nanum Myeongjo",Georgia,serif;font-size:14px;margin:12px 0;white-space:pre-line}
  .card .paper p{margin:0 0 6px}
  .card .small{color:var(--dim);font-size:12px}
  .card .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .card .shelf{font-size:26px;letter-spacing:6px;text-align:center;margin:6px 0}
  @media (max-width:560px){#stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div><h1>마지막 사람 · 1일차</h1><div class="theme">오늘의 주제 — 물이 탁해졌다</div></div>
    <div style="display:flex;align-items:center;gap:10px"><div id="clock">06:00</div><button id="mute" style="padding:4px 10px;font-size:12px">♪ 음악 켜짐</button></div>
  </header>
  <div id="stats"></div>
  <div id="mono"><span class="say" id="say"></span><span class="count" id="count"></span></div>
  <canvas id="cv" width="800" height="480"></canvas>
  <div id="hud">
    <div id="inv"><div class="lbl">배낭</div><div id="invList"></div></div>
    <div id="actions"></div>
  </div>
  <div id="log"></div>
  <div id="help">이동: WASD / 방향키 · 화면 탭/클릭으로 이동 · 행동: Space 또는 숫자키 1~4 · 반짝이는 곳에 무언가 있다</div>
</div>
<div id="ov"><div class="card" id="ovCard"></div></div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=480;
const dark=document.createElement('canvas');dark.width=W;dark.height=H;const dctx=dark.getContext('2d');
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ---------- deterministic decoration ----------
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const tufts=[];for(let i=0;i<220;i++)tufts.push({x:rnd()*W,y:rnd()*H,s:2+rnd()*3,c:rnd()});
const trees=[];seed=11;
for(let i=0;i<24;i++){trees.push({x:45+rnd()*250,y:335+rnd()*125,r:14+rnd()*12,t:rnd()})}
trees.push({x:600,y:60,r:22,t:.3},{x:560,y:420,r:18,t:.6},{x:300,y:60,r:16,t:.8},{x:520,y:130,r:14,t:.2});
trees.sort((a,b)=>a.y-b.y);
const blocks=[];seed=23;
for(let i=0;i<9;i++){blocks.push({x:45+rnd()*190,y:30+rnd()*120,w:30+rnd()*45,h:22+rnd()*35,a:(rnd()-.5)*.5,g:150+rnd()*40|0})}

// ---------- things to find ----------
// kind: 'use' = practical item, 'mem' = memory item (can be taken home or left)
const FINDS=[
  {id:'bottle',x:118,y:92,icon:'🧴',kind:'use',name:'찌그러진 페트병',
   text:'콘크리트 틈에 끼어 있던 페트병. 찌그러졌지만 구멍은 없다.\n물을 담을 수 있겠다. 오늘 가장 필요한 물건.'},
  {id:'can',x:300,y:262,icon:'🥫',kind:'use',name:'녹슨 통조림',
   text:'길가 덤불 아래 반쯤 묻혀 있었다. 라벨은 다 지워졌다.\n그래도 먹을 수는 있을 것이다.'},
  {id:'shoe',x:222,y:150,icon:'👟',kind:'mem',name:'작은 운동화',
   text:'아이 발만 한 운동화 한 짝.\n끈이 한쪽만 묶여 있다. 급하게 신다 만 것처럼.'},
  {id:'letter',x:66,y:165,icon:'✉️',kind:'mem',name:'젖은 편지',
   text:'번진 글씨를 겨우 읽었다.\n\n「수아야, 아빠가 먼저 북쪽 대피소에 가서 자리 잡아 둘게. 엄마 손 꼭 잡고 다음 버스 타. 무서우면 노래 불러. 아빠도 부를게.」'},
  {id:'sign',x:565,y:92,icon:'🚏',kind:'mem',name:'정류장 표지판 조각',
   text:'녹슨 철판에 글자가 남아 있다.\n\n「북쪽 대피소 행 · 막차 18:00」\n\n막차는 왔을까.'},
  {id:'watch',x:92,y:432,icon:'⌚',kind:'mem',name:'멈춘 손목시계',
   text:'나무뿌리에 감겨 있던 손목시계. 바늘이 4시 17분에 멈춰 있다.\n그날, 이 근방 시계는 모두 그 시간에 멈췄다.\n나도 기억한다. 아니, 기억하는 것 같다.'},
  {id:'drawing',x:628,y:405,icon:'🖍️',kind:'mem',name:'크레용 그림',
   text:'강가 바위 틈, 비닐에 싸인 종이 한 장.\n집과 해, 그리고 사람 셋. 가장 작은 사람 옆에 삐뚤빼뚤 「수아」라고 적혀 있다.'},
  {id:'musicbox',x:262,y:452,icon:'🎵',kind:'mem',name:'오르골',
   text:'흙을 털고 태엽을 감았다.\n몇 음이 흘러나오다 멈췄다.\n처음 듣는 곡인데, 다음 음을 알 것 같았다.'},
];
const MEM_TOTAL=FINDS.filter(f=>f.kind==='mem').length;

// ---------- state ----------
let S;
function fresh(){return{
  t:360, hp:80, food:55, water:45, mind:50,
  inv:{bottle:false,bw:null,wood:0,can:0,cloth:false,lighter:false,cray:0}, // bw: water in bottle: null|'dirty'|'filtered'|'rain'|'boiled'
  found:{},          // id -> 'taken' | 'left' | 'placed' | 'used'
  carry:[],          // memory items in backpack
  car:0, barrel:false, bush:0, rock:false,
  fire:false, radio:0, signal:false,
  drankClean:0, drankDirty:0, drankRiver:0, sick:false, ateCan:0, berries:0, forest:0,
  p:{x:400,y:300,face:1,step:0}, target:null, running:false, ended:false, warnedDark:false
}}

// ---------- places ----------
const POI=[
  {id:'car',x:528,y:196,r:40,name:'녹슨 자동차'},
  {id:'barrel',x:488,y:296,r:26,name:'빗물통'},
  {id:'bush',x:332,y:300,r:28,name:'산딸기 덤불'},
  {id:'rock',x:606,y:332,r:26,name:'강가 바위'},
  {id:'forest',x:150,y:405,r:70,name:'숲'},
  {id:'river',x:660,y:240,r:0,name:'강가'},
  {id:'fire',x:400,y:345,r:42,name:'모닥불 자리'},
  {id:'radio',x:368,y:222,r:30,name:'낡은 라디오'},
  {id:'bed',x:436,y:222,r:30,name:'잠자리'},
];
function nearPOI(){
  const p=S.p;
  // undiscovered things take priority
  for(const f of FINDS){if(!S.found[f.id]&&Math.hypot(p.x-f.x,p.y-f.y)<34)return{id:'find',find:f,name:'무언가 있다'}}
  if(p.x>628)return POI.find(o=>o.id==='river');
  let best=null,bd=1e9;
  for(const o of POI){if(o.id==='river')continue;const d=Math.hypot(p.x-o.x,p.y-o.y);if(d<o.r&&d<bd){bd=d;best=o}}
  return best;
}
const inShelter=()=>S.p.x>338&&S.p.x<462&&S.p.y>184&&S.p.y<268;

function actionsFor(o){
  const I=S.inv,a=[];
  if(!o)return a;
  switch(o.id){
    case 'find':
      a.push({label:'살펴보기',cost:10,ok:true,fn:()=>showFind(o.find)});break;
    case 'car':
      if(S.car===0)a.push({label:'트렁크 열어 보기',cost:20,ok:true,fn:()=>{S.car=1;I.cloth=true;log('녹슨 트렁크를 힘껏 들어 올렸다. 곰팡내 나는 담요 사이에서 쓸 만한 헝겊을 찾았다. (헝겊 획득)')}});
      else if(S.car===1)a.push({label:'운전석 살펴보기',cost:15,ok:true,fn:()=>{S.car=2;I.lighter=true;S.mind=Math.min(100,S.mind+3);log('글러브박스 안에 일회용 라이터. 몇 번 그으니 작은 불꽃이 인다. 아직 가스가 남아 있다. (라이터 획득)')}});
      else a.push({label:'운전석에 앉아 보기',cost:10,ok:true,fn:()=>{S.mind=Math.min(100,S.mind+2);log('운전석에 앉아 금 간 유리 너머를 봤다. 이 길 끝엔 뭐가 있었을까.')}});
      break;
    case 'barrel':
      if(!S.barrel)a.push({label:'빗물 병에 담기',cost:10,ok:I.bottle&&!I.bw,why:I.bottle?'병이 이미 차 있다':'담을 그릇이 없다',fn:()=>{S.barrel=true;I.bw='rain';log('어젯밤 비가 통에 조금 고여 있었다. 병 하나를 겨우 채웠다. 맑다.')}});
      else a.push({label:'들여다보기',cost:5,ok:true,fn:()=>log('통 바닥이 말라 있다. 다음 비를 기다려야 한다.')});
      break;
    case 'bush':
      a.push({label:'덤불 헤치기',cost:15,ok:S.bush<2,why:'남은 열매가 없다',fn:()=>{S.bush++;S.food=Math.min(100,S.food+10);S.berries++;log(S.bush===1?'가시에 손등이 긁혔지만, 잘 익은 산딸기를 한 줌 땄다. (식량 +10)':'안쪽 깊숙이 남은 몇 알을 마저 땄다. (식량 +10)')}});
      break;
    case 'rock':
      a.push({label:'바위 들춰 보기',cost:15,ok:!S.rock,why:'이미 들춰 봤다',fn:()=>{S.rock=true;I.cray++;log('바위를 굴리자 작은 가재 한 마리가 허둥댄다. 재빨리 잡았다. 불에 구우면 먹을 수 있겠다. (가재 획득)')}});
      break;
    case 'forest':
      a.push({label:'마른 가지 줍기',cost:20,ok:true,fn:gather});break;
    case 'river':
      a.push({label:'병에 강물 담기',cost:10,ok:I.bottle&&!I.bw,why:I.bottle?'병이 이미 차 있다':'담을 그릇이 없다',fn:()=>{I.bw='dirty';log('흙빛 강물을 병에 담았다. 냄새가 난다.')}});
      if(I.cloth)a.push({label:'헝겊으로 걸러 담기',cost:25,ok:I.bottle&&!I.bw,why:I.bottle?'병이 이미 차 있다':'담을 그릇이 없다',fn:()=>{I.bw='filtered';log('헝겊을 병 입구에 대고 천천히 물을 걸렀다. 흙은 대부분 걸러졌다.')}});
      a.push({label:'강물 그냥 마시기',cost:5,ok:true,fn:()=>{S.water=Math.min(100,S.water+25);S.hp-=12;S.drankRiver++;S.sick=true;log('목은 축였지만 속이 뒤틀린다. (체력 -12, 배탈)')}});
      break;
    case 'fire':
      if(!S.fire){
        if(I.lighter)a.push({label:'라이터로 불 피우기 (땔감 2)',cost:10,ok:I.wood>=2,why:'땔감이 부족하다',fn:lightFire});
        else a.push({label:'나무 비벼 불 피우기 (땔감 2)',cost:60,ok:I.wood>=2,why:'땔감이 부족하다',fn:()=>{S.mind=Math.max(0,S.mind-3);lightFire();log('한 시간을 비벼서야 연기가 났다. 손바닥이 얼얼하다. (정신력 -3)')}});
      }
      a.push({label:'물 끓이기',cost:25,ok:S.fire&&!!I.bw&&I.bw!=='boiled',why:S.fire?'끓일 물이 없다':'불이 없다',fn:()=>{I.bw='boiled';log('물을 오래 끓였다. 김이 오르는 걸 한참 바라봤다.')}});
      if(I.cray)a.push({label:'가재 구워 먹기',cost:15,ok:S.fire,why:'불이 없다',fn:()=>{I.cray--;S.food=Math.min(100,S.food+18);S.mind=Math.min(100,S.mind+3);log('가재가 붉게 익었다. 한 입 거리지만 따뜻한 음식이다. (식량 +18)')}});
      break;
    case 'shelter':
      break;
    case 'radio':
      a.push({label:'라디오 켜기',cost:20,ok:true,fn:useRadio});break;
    case 'bed':
      a.push({label:'잠들기 (하루 마치기)',cost:0,ok:S.t>=15*60,why:'아직 해가 높다 (15시 이후)',fn:()=>endDay(false)});break;
  }
  return a;
}
function gather(){
  S.forest++;S.inv.wood++;
  log(S.forest===1?'바닥에 떨어진 마른 가지를 모았다. (땔감 +1)':S.forest===2?'부러진 가지를 한 아름 더 주웠다. (땔감 +1)':'마른 가지를 모았다. (땔감 +1)');
}
function lightFire(){S.inv.wood-=2;S.fire=true;S.mind=Math.min(100,S.mind+6);log('불이 붙었다. 타닥거리는 소리가 이상하게 위로가 된다. (정신력 +6)')}
// drinking from the bottle works anywhere
function drinkActions(){
  const I=S.inv,a=[];
  if(!I.bw)return a;
  const D={
    boiled:{label:'끓인 물 마시기',w:40,hp:0,msg:'미지근하지만 깨끗한 물. 살 것 같다. (물 +40)'},
    rain:{label:'빗물 마시기',w:35,hp:0,msg:'차갑고 맑다. 하늘이 준 물. (물 +35)'},
    filtered:{label:'걸러낸 물 마시기',w:30,hp:-3,msg:'흙맛이 조금 남았지만 마실 만하다. (물 +30, 체력 -3)'},
    dirty:{label:'탁한 물 마시기',w:30,hp:-10,sick:true,msg:'참지 못하고 들이켰다. 곧 배가 아파 온다. (물 +30, 체력 -10)'},
  }[I.bw];
  a.push({label:'🧴 '+D.label,cost:5,ok:true,fn:()=>{S.water=Math.min(100,S.water+D.w);S.hp+=D.hp;if(D.sick){S.sick=true;S.drankDirty++}else S.drankClean++;S.lastDrink=I.bw;I.bw=null;log(D.msg)}});
  return a;
}
function useRadio(){
  S.radio++;
  if(S.radio===1){S.signal=true;S.mind=Math.min(100,S.mind+8);log('지지직… 잡음 사이로 무언가 들렸다. "…여기는… 북쪽…" 그리고 끊겼다. (정신력 +8)')}
  else {S.mind=Math.min(100,S.mind+2);log('다시 다이얼을 돌려 봤지만 잡음뿐이다. 그래도 소리가 있다는 게 좋다.')}
}
function eatCan(){
  if(!S.inv.can||!S.running)return;
  S.inv.can--;S.ateCan++;S.food=Math.min(100,S.food+30);advance(10);
  log('칼로 통조림을 땄다. 정체 모를 콩 요리. 맛은 상관없다. (식량 +30)');
}

// ---------- discovery card ----------
function showFind(f){
  S.running=false;
  if(f.id==='musicbox')Music.musicBox();
  const btns=f.kind==='use'
    ? `<button id="c1">챙긴다</button>`
    : `<button id="c1">가져간다</button><button id="c2" class="ghost">그 자리에 둔다</button>`;
  card.innerHTML=`<div class="icon">${f.icon}</div><h2 style="text-align:center">${f.name}</h2>
  <div class="paper">${f.text}</div><div class="btns" style="justify-content:center">${btns}</div>`;
  ov.classList.remove('hide');

function placeCarried(){
  if(!S.carry.length)return;

// ---------- time & stats ----------
function advance(m){
  S.t+=m;
  S.water-=0.035*m; S.food-=0.022*m; S.mind-=0.012*m;
  if(S.sick)S.hp-=0.012*m;
  if(S.water<=0){S.water=0;S.hp-=0.05*m}
  if(S.food<=0){S.food=0;S.hp-=0.03*m}
  if(S.mind<=0){S.mind=0;S.hp-=0.02*m}
  S.hp=Math.min(100,S.hp);
  if(S.hp<=0){S.hp=0;gameOver();return}
  if(S.t>=20*60&&!S.warnedDark){S.warnedDark=true;log('해가 거의 졌다. 21시가 되기 전에 쉼터로 돌아가자.')}
  if(S.t>=21*60)endDay(true);
}
function doAction(a){
  if(!S.running||!a||!a.ok)return;
  a.fn();
  if(S.running)advance(a.cost);else if(!S.ended)S.t+=a.cost;
  dirtyUI=true;
}

// ---------- monologue (soft guidance) ----------
function monologue(){
  const I=S.inv,mem=FINDS.filter(f=>f.kind==='mem'&&S.found[f.id]).length;
  let s;
  if(S.t>=18*60)s='해가 기운다. 이제 쉼터로 돌아가 쉬자.';
  else if(!I.bottle&&!S.drankClean)s='강물이 흙빛이다. 물을 담을 그릇부터 찾아야겠다. 무너진 건물 쪽에서 뭔가 반짝였다.';
  else if(!S.drankClean&&!I.bw&&!S.barrel)s='병은 구했다. 어젯밤 비가 쉼터 옆 통에 고였을지도. 아니면 강물을 떠다 끓이거나.';
  else if(!S.drankClean&&!I.bw)s='강물을 떠 오자. 그냥은 못 마신다. 끓이든, 거르든.';
  else if(!S.drankClean&&I.bw==='dirty'&&!S.fire&&I.wood<2)s='흙탕물이다. 끓이려면 숲에서 마른 가지를 주워 와야 한다.';
  else if(!S.drankClean&&I.bw==='dirty'&&!S.fire)s=I.lighter?'땔감은 됐다. 모닥불 자리에서 라이터로 불을 붙이자.':'땔감은 됐다. 불씨가 없으니 비벼야 하나… 길가 차 안에 뭔가 있을지도.';
  else if(!S.drankClean&&I.bw==='dirty')s='불이 있다. 끓이면 마실 수 있을 것이다.';
  else if(!S.drankClean&&I.bw)s='물이 있다. 목부터 축이자.';
  else if(!S.fire&&S.t>=15*60)s='밤이 오기 전에 불을 피워 두고 싶다.';
  else if(mem<MEM_TOTAL)s=mem===0?'목은 축였다. 해가 지기 전까지 천천히 걸어 보자. 여기저기 반짝이는 게 있다.':'이 근처에 누가 살았던 걸까. 조금 더 걸어 보자.';
  else s='오늘은 많이 걸었다. 쉼터로 돌아가 쉬자.';
  if(S.carry.length&&S.t<18*60)s+=' 배낭 속 물건은 쉼터에 가져다 두자.';
  return {s,mem};
}

const keys={};
addEventListener('keydown',e=>{

  ctx.fillStyle='#9a9a94';ctx.beginPath();ctx.arc(p.x,p.y-12+bob,6.2,Math.PI,0);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(p.x+p.face*2.5-1,p.y-10+bob,2,2);
  ctx.fillStyle='#3a332c';ctx.fillRect(p.x-p.face*8-2,p.y-2+bob,5,9);
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  if(S.running){
    const p=S.p;let dx=0,dy=0;
    if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;
    if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;
    if(dx||dy)S.target=null;
    else if(S.target){const tx=S.target.x-p.x,ty=S.target.y-p.y,d=Math.hypot(tx,ty);if(d<3)S.target=null;else{dx=tx/d;dy=ty/d}}
    if(dx||dy){
      const l=Math.hypot(dx,dy),sp=.15*dt;
      p.x+=dx/l*sp;p.y+=dy/l*sp;if(dx)p.face=dx>0?1:-1;p.step+=dt/85;
      p.x=Math.max(14,Math.min(645,p.x));p.y=Math.max(22,Math.min(H-14,p.y));
    }
    if(inShelter())placeCarried();
    advance(dt/1000/0.2); // 1 game-minute ≈ 0.2 s real time
    if(S.running)renderUI();
  }
  draw(now);
  requestAnimationFrame(frame);
}

// ---------- music (generated in-browser, no files) ----------
const Music=(()=>{
  let ac,master,tone,timer,nextBar=0,bar=0,on=true,mel=2,duckUntil=0;
  const BAR=8;
  const chords=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[52,55,59,62]]; // Am7 · Fmaj7 · Cmaj7 · Em7
  const scale=[69,72,74,76,79,81,84];
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const VOL=.55;
  function impulse(sec){const len=ac.sampleRate*sec|0,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return b}
  function start(){
    if(ac){if(ac.state==='suspended')ac.resume();return}
    try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const verb=ac.createConvolver();verb.buffer=impulse(5);const wet=ac.createGain();wet.gain.value=.6;verb.connect(wet);wet.connect(master);
    const dry=ac.createGain();dry.gain.value=.45;dry.connect(master);
    tone=ac.createBiquadFilter();tone.type='lowpass';tone.frequency.value=2400;tone.connect(dry);tone.connect(verb);
    wind();
    nextBar=ac.currentTime+.3;
    timer=setInterval(schedule,250);schedule();
    if(on)master.gain.linearRampToValueAtTime(VOL,ac.currentTime+5);
  }
  function schedule(){
    if(!ac)return;
    const night=S&&S.t>=18*60;
    tone.frequency.setTargetAtTime(night?1100:2400,ac.currentTime,3);
    while(nextBar<ac.currentTime+1.5){playBar(nextBar,bar,night);nextBar+=BAR;bar++}
  }
  function playBar(t,n,night){
    const ch=chords[n%4];
    ch.forEach((m,i)=>padNote(mtof(i===0?m-24:m-12),t,BAR+3,i===0?.045:.028));
    for(let k=0;k<8;k++){
      if(t+k<duckUntil)continue; // stay quiet while the music box plays
      const p=night?.2:.3;
      if(Math.random()<p||(k===0&&n%2===0)){
        mel=Math.max(0,Math.min(scale.length-1,mel+Math.round((Math.random()-.5)*3)));
        pluck(mtof(scale[mel]-(night?12:0)),t+k+Math.random()*.1,.12,3.8);
      }
    }
    if(n%4===0&&t>=duckUntil)pluck(mtof(ch[0]-12),t,.08,7);
  }
  function padNote(f,t,dur,vol){
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+3);g.gain.setValueAtTime(vol,t+dur-3);g.gain.linearRampToValueAtTime(0,t+dur);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;
    [-6,6].forEach(d=>{const o=ac.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=d;o.connect(lp);o.start(t);o.stop(t+dur+.1)});
    lp.connect(g);g.connect(tone);
  }
  function pluck(f,t,vol,dec){
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
    const o=ac.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);
    const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2.003;const g2=ac.createGain();g2.gain.value=.18;o2.connect(g2);g2.connect(g);
    g.connect(tone);o.start(t);o2.start(t);o.stop(t+dec+.1);o2.stop(t+dec+.1);
  }
  function wind(){
    const len=ac.sampleRate*3,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){last=(last+(Math.random()*2-1)*.02)*.995;d[i]=last*6}
    const src=ac.createBufferSource();src.buffer=b;src.loop=true;
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.6;
    const lfo=ac.createOscillator();lfo.frequency.value=.06;const lg=ac.createGain();lg.gain.value=220;lfo.connect(lg);lg.connect(bp.frequency);
    const g=ac.createGain();g.gain.value=.05;
    src.connect(bp);bp.connect(g);g.connect(master);src.start();lfo.start();
  }
  // a short, slightly broken music-box phrase that stops before it resolves
  function musicBox(){
    if(!ac||!on)return;
    const t0=ac.currentTime+.4;
    const notes=[81,84,83,79,76,79,81,76,74,76];
    let t=t0;
    notes.forEach((m,i)=>{
      const slow=1+i*.07; // winding down
      const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
      const o=ac.createOscillator();o.type='sine';o.frequency.value=mtof(m+12);o.detune.value=(Math.random()-.5)*14;
      const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=mtof(m+12)*3.01;const g2=ac.createGain();g2.gain.value=.12;
      o.connect(g);o2.connect(g2);g2.connect(g);g.connect(tone);
      o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7);
      t+=.42*slow;
    });
    duckUntil=t+1.5;
  }
  function setOn(v){
    on=v;if(!ac)return;
    const now=ac.currentTime;master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);master.gain.linearRampToValueAtTime(v?VOL:0,now+1.2);
  }
  return{start,setOn,musicBox,get on(){return on}};
})();
const muteBtn=document.getElementById('mute');
muteBtn.onclick=()=>{Music.start();Music.setOn(!Music.on);muteBtn.textContent=Music.on?'♪ 음악 켜짐':'♪ 음악 꺼짐';muteBtn.blur()};

// ---------- screens ----------
const ov=document.getElementById('ov'),card=document.getElementById('ovCard');
function intro(){
  S=fresh();logEl.innerHTML='';dirtyUI=true;lastSay='';
  card.innerHTML=`<h2>마지막 사람</h2><div class="sub">멸망 후 50년 · 1일차</div>
  <p>마지막으로 사람 목소리를 들은 게 언제였는지 기억나지 않는다. 도시는 숲이 되었고, 나는 강가의 작은 쉼터에서 하루하루를 지낸다.</p>
  <p>어젯밤 비가 그친 뒤로 강물이 흙빛이다. 마실 물을 구해야 한다.<br>그리고 오늘은, 조금 멀리까지 걸어 볼 생각이다.</p>
  <p class="small">✦ 반짝이는 곳에는 50년 전의 물건이 있습니다. 가져가서 쉼터에 둘 수도, 그 자리에 둘 수도 있어요.<br>자동차, 빗물통, 덤불, 바위처럼 주변 사물에 다가가면 만져 볼 수 있어요. 쓸모 있는 물건이 나오기도 합니다.<br>물을 얻는 방법은 하나가 아닙니다.<br>위쪽의 💭 혼잣말이 다음에 할 일을 넌지시 알려 줍니다.<br>이동: WASD·방향키 또는 화면 탭 · 행동: Space·숫자키 또는 버튼</p>
  <button id="go">하루 시작하기</button>`;
  ov.classList.remove('hide');
  document.getElementById('go').onclick=()=>{Music.start();ov.classList.add('hide');S.running=true;log('눈을 떴다. 목이 마르다.');renderUI()};
}
function endDay(forced){
  if(S.ended)return;
  if(inShelter())placeCarried();
  S.ended=true;S.running=false;
  const home=inShelter();
  if(forced&&!home){S.mind=Math.max(0,S.mind-8)}
  const st=id=>S.found[id];
  const placed=FINDS.filter(f=>st(f.id)==='placed'), left=FINDS.filter(f=>st(f.id)==='left');
  const has=id=>st(id)==='placed'||st(id)==='taken';
  const seen=id=>!!st(id);
  const L=['1일차.'];
  if(S.lastDrink==='rain')L.push('강물이 흙빛이었다. 다행히 통에 빗물이 고여 있었다. 하늘이 한 번 봐준 셈이다.');
  else if(S.lastDrink==='filtered')L.push('강물이 흙빛이었다. 차에서 찾은 헝겊으로 걸러 마셨다. 흙맛은 났지만 버틸 만했다.');
  else if(S.drankClean)L.push('강물이 흙빛이었다. 주운 병에 물을 담아 끓였다. 끓인 물이 이렇게 달 줄은 몰랐다.');
  else if(S.drankDirty||S.drankRiver)L.push('강물이 흙빛이었다. 참지 못하고 그냥 마셨다. 배 속이 계속 뒤틀린다.');
  else L.push('강물이 흙빛이었다. 결국 물을 한 모금도 마시지 못했다.');
  if(has('shoe'))L.push('작은 운동화를 문가에 두었다. 끈 한쪽은 풀린 채로.');
  if(has('watch'))L.push('멈춘 시계를 벽에 걸었다. 4시 17분. 이제 이 방에도 그 시간이 있다.');
  if(has('musicbox'))L.push('오르골을 머리맡에 두었다. 잠들기 전에 한 번 더 감아 볼 생각이다.');
  if((seen('letter')||seen('drawing'))&&(seen('letter')&&seen('drawing')))L.push('편지와 그림 속 아이의 이름은 수아. 몇 번이고 소리 내어 불러 봤다. 이상하게, 입에 익었다.');
  else if(seen('letter'))L.push('편지 속 아이의 이름은 수아였다. 아빠는 먼저 북쪽으로 갔다고 했다.');
  else if(seen('drawing'))L.push('그림 속 가장 작은 사람, 수아. 누구였을까.');
  const north=[S.signal&&'라디오',seen('letter')&&'편지',seen('sign')&&'표지판'].filter(Boolean);
  if(north.length>=2)L.push(`${north.join('에도, ')}에도 '북쪽'이 있었다.`);
  else if(seen('sign'))L.push('북쪽 대피소 행 막차, 18시. 막차는 왔을까.');
  if(left.length)L.push('두고 온 것도 있다. 내일 다시 보러 가도 될 것이다.');
  if(forced&&!home)L.push('어둠 속에서 길을 잃을 뻔했다. 겨우 쉼터로 돌아왔다.');
  const memCount=FINDS.filter(f=>f.kind==='mem'&&seen(f.id)).length;
  if(memCount===0)L.push('오늘은 물만 생각했다. 쉼터가 여전히 휑하다.');
  card.innerHTML=`<h2>밤 — 생존 일지</h2><div class="sub">발견한 기억 ${memCount}/${MEM_TOTAL}</div>
  <div class="paper">${L.map(l=>`<p>${l}</p>`).join('')}</div>
  ${placed.length?`<p class="small" style="text-align:center;margin-bottom:0">오늘 밤 쉼터에 놓인 것</p><div class="shelf">${placed.map(f=>f.icon).join('')}</div>`:''}
  <p class="small">체력 ${Math.round(S.hp)} · 식량 ${Math.round(S.food)} · 물 ${Math.round(S.water)} · 정신력 ${Math.round(S.mind)}</p>
  <p class="small">다음 날 주제 예고 — <b style="color:var(--accent)">2일차: 폭풍이 온다</b> (프로토타입은 1일차까지)</p>
  <div class="btns"><button id="again">1일차 다시 걷기</button></div>`;
  ov.classList.remove('hide');document.getElementById('again').onclick=intro;
}
function gameOver(){
  if(S.ended)return;S.ended=true;S.running=false;
  card.innerHTML=`<h2>쓰러졌다</h2><div class="sub">1일차 · ${fmt(S.t)}</div>
  <div class="paper"><p>일지의 마지막 장은 비어 있다.</p></div>
  <p class="small">탁한 물을 그냥 마시면 체력이 줄고 배탈이 난다. 물이 0이 되면 체력이 줄어든다.</p>
  <div class="btns"><button id="again">다시 하기</button></div>`;
  ov.classList.remove('hide');document.getElementById('again').onclick=intro;
}

intro();
requestAnimationFrame(frame);
})();
